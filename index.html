  if(['golemX','robot','drone'].includes(k)) return 'mesin';

}

// akar = spesies tahap 1; setiap akar × elemen = satu jalur evolusi tersendiri
const SKIP_MON=new Set([]);
const EVO_PREV={}; for(const [a,b] of Object.entries(EVO_NEXT)) (EVO_PREV[b]=EVO_PREV[b]||[]).push(a);
function monStage(k){ return MON[k].evo||1; }
const ROOTS=Object.keys(MON).filter(k=>{ const m=MON[k]; return !SKIP_MON.has(k)&&!m.evolved&&!(EVO_PREV[k]&&monStage(k)>1); });
const SPECIES={}; let SPECIES_N=0;
function rankRar(rank){ const i=RANK_ORDER.indexOf(rank); return i<=1?0:i<=3?1:i===4?2:i===5?3:4; }
function spId(k,el){ return el?k+'.'+el:k; }
function makeSpecies(k,el){
  const id=spId(k,el); if(SPECIES[id]) return SPECIES[id];
  const m=MON[k], E=ELEM_BY[el||''];
  const s={id,mk:k,el:el||'',n:E.n?`${E.n} ${m.n}`:m.n,stage:monStage(k),rank:m.rank,
    hp:Math.round(m.hp*(E.id==='batu'||E.id==='baja'?1.2:1)),atk:+(m.atk*(E.id==='api'||E.id==='petir'||E.id==='lava'?1.15:1)).toFixed(1),
    spd:m.spd||1,ranged:!!m.ranged,legend:!!m.legend,
    rar:Math.min(4,rankRar(m.rank)+E.rar+(m.legend?1:0)),ab:E.ab||baseAbil(m),next:null};
  SPECIES[id]=s; SPECIES_N++;
  const nx=EVO_NEXT[k]; if(nx&&MON[nx]) s.next=makeSpecies(nx,el).id;
  return s;
}
for(const k of ROOTS){ const m=MON[k]; for(const E of ELEM){ if(m.legend&&E.id&&E.rar<1) continue; makeSpecies(k,E.id); } }
const GACHA_POOL={N:[],R:[],SR:[],SSR:[],UR:[]};
for(const id in SPECIES){ const s=SPECIES[id]; if(s.stage!==1) continue; if(EVO_PREV[s.mk]&&!ROOTS.includes(s.mk)) continue; GACHA_POOL[RARITY[s.rar]].push(id); }
function maxStageOf(sid){ let s=SPECIES[sid], st=s.stage, n=0; while(s.next&&n<6){ s=SPECIES[s.next]; st=s.stage; n++; } return st; }

function nid(){ return G.nextId++; }
function fdir(f){ return f%2===0?1:-1; }

  G={v:1,nextId:1,t:0,day:1,mana:120,gold:600,jiwa:40,pop:0,floors:3,fix:[],mons:[],people:{},parties:[],advs:[],lord:null,

  for(let f=0;f<G.floors;f++) G.fix.push(Array(SLOTS).fill(null));
  newLord(true);
  const starters=[['slime',0],['goblin',0],['kelelawar',1],['kobold',1],['wolf',2]];
  starters.forEach(([k,f],i)=>{ const m=addMonster(k); m.lv=5; m.floor=f; m.px=SLOT_X(i%2?3:6); m.x=m.px; checkLearn(m,true); m.hp=monStats(m).hp; });
  G.fix[0][3]={t:'duri'}; G.fix[1][6]={t:'chest',r:'F'}; G.fix[2][2]={t:'chest',r:'E'};

}
function addMonster(sid){
  const s=SPECIES[sid]; const m={id:nid(),name:monName(),pers:pick(PERS_KEYS),ask:0,askDay:0,sp:sid,lv:1,exp:0,abil:[s.ab],floor:-1,px:SLOT_X(ri(1,8)),x:0,strat:'jaga',flee:false,loy:60,hp:1,dead:false,reviveAt:0,kills:0,boost:1,cd:{},fx:{},secret:null,born:G.day};
  m.hp=monStats(m).hp; m.x=m.px; G.mons.push(m); return m;
}

function monStats(m){
  const s=SPECIES[m.sp]; const lf=.85+m.loy*.003;
  const lr=G&&G.lord?G.lord.race:''; const rg=G&&G.rage>G.t?1.3:1;
  let hp=s.hp*2.2*(1+.12*(m.lv-1))*m.boost*lf, atk=s.atk*2*(1+.1*(m.lv-1))*m.boost*lf*(lr==='iblis'?1.1:1)*rg;

function monGainExp(m,n){

    m.exp-=monNeed(m); m.lv++; checkLearn(m); const st=monStats(m); m.hp=Math.min(st.hp,m.hp+st.hp*.25);

}

}

function lordTick(dt){
  const L=G.lord; if(L.hp<=0) return; const st=lordStats(); const f=topF();
  for(const k in L.cd) L.cd[k]-=dt;
  if(L.hp<st.hp&&!G.advs.some(a=>a.floor===f)) L.hp=Math.min(st.hp,L.hp+st.hp*.05*dt);
  const home=fend(f); const near=G.advs.filter(a=>a.floor===f&&Math.abs(a.x-home)<95);
  if(near.length){ const n_=near.sort((a,b)=>Math.abs(a.x-L.x)-Math.abs(b.x-L.x))[0]; const dx=n_.x-L.x; if(Math.abs(dx)>st.rng-2){ const nx=L.x+Math.sign(dx)*16*dt; if(Math.abs(nx-home)<75) L.x=nx; } }
  else if(Math.abs(L.x-home)>1) L.x+=Math.sign(home-L.x)*Math.min(Math.abs(home-L.x),20*dt);
  const foes=G.advs.filter(a=>a.floor===f&&Math.abs(a.x-L.x)<st.rng+4);
  if(!foes.length) return;
  const src={kind:'l'};
  if((L.cd.sp||0)<=0){ L.cd.sp=9; const r=L.race;
    if(r==='naga'){ say(L.x,f,'Napas Naga!','#ff8a3a',1.3); fxAt('fire',L.x-fdir(f)*20,f,'#ff6a2a',1); for(const a of G.advs.filter(a=>a.floor===f&&Math.abs(a.x-L.x)<70)) hitAdv(a,st.atk,src,{mult:1.4}); }
    else if(r==='succubus'){ const a=pick(foes); a.fx.charm=G.t+5; say(L.x,f,'Pikatan!','#ff7ab0',1.2); fxAt('heart',a.x,f,'#ff7ab0',1); }
    else { say(L.x,f,'Gelombang Kegelapan','#c060ff',1.3); fxAt('blast',L.x,f,'#8a3aff',.8); for(const a of foes) hitAdv(a,st.atk,src,{mult:1.2}); }
    return; }
  if((L.cd.atk||0)<=0){ L.cd.atk=1.1; L.atkT=G.t; const t=foes.sort((a,b)=>Math.abs(a.x-L.x)-Math.abs(b.x-L.x))[0]; fxAt('claw',t.x,f,'#ff6080',.3); hitAdv(t,st.atk,src,{crit:rnd()<.08}); }
}

/* ---------- tik utama ---------- */
function step(){
  const dt=DT; G.t+=dt;
  const day=1+Math.floor(G.t/DAY_LEN); if(day!==G.day){ G.day=day; dailyTick(); }
  G.mana+=dt*(1+G.advs.length*.15+G.floors*.06)*(G.lord.race==='elfGelap'?1.5:1);
  G.pop+=dt*.004*G.floors; G.gold+=dt*(.6+G.floors*.15);
  for(const a of G.advs) if(a.floor>(G.stats.deep||0)) G.stats.deep=a.floor;
  for(let i=TIMERS.length-1;i>=0;i--) if((!TIMERS[i].w||TIMERS[i].w===G)&&G.t>=TIMERS[i].at){ const t=TIMERS[i]; TIMERS.splice(i,1); t.fn(); }
  spawnTick(dt); if(Math.floor(G.t)!==Math.floor(G.t-dt)) heroTick();
  for(const a of G.advs.slice()) advTick(a,dt);
  for(const pa of G.parties) if(pa.state==='in') partyTick(pa);
  for(const m of G.mons) monTick(m,dt);
  for(const m of G.mons) if(m.temp&&(G.t>m.temp||m.dead)){ m.dead=true; m.gone=1; }
  if(G.mons.some(m=>m.gone)) G.mons=G.mons.filter(m=>!m.gone);
  if(G.lord) lordTick(dt);
  assistTick(dt);
}
function dailyTick(){
  // kesetiaan pelan-pelan naik dengan aura
  for(const m of G.mons) m.loy=clamp(m.loy+(G.aura>=10?1:0)-(m.loy>70&&G.aura<5?1:0),0,100);
  if(G.day%5===0) log(`Hari ${G.day}. Popularitas ${Math.round(G.pop)} · ${G.floors} lantai · Raja Iblis ${G.lord.name} Lv${G.lord.lv} bertahan ${Math.round((G.t-G.lordSince)/DAY_LEN*10)/10} hari.`,'sys');
}

function itemBroken(it){ itFix(it); return it.dur<=0; }
const _itemStats=itemStats;
itemStats=function(it){ const s=_itemStats(it); if(!it.mods&&!it.runes) return s; if(itemBroken(it)) return {atk:0,hp:0,def:0,eva:0}; const k=1+(it.lv||0)*.12;
  for(const md of itemMods(it)){ if(md.k==='atk') s.atk+=md.v*k; else if(md.k==='def') s.def+=md.v*k; else if(md.k==='hp') s.hp+=md.v*k; else if(md.k==='eva') s.eva+=md.v; } return s; };
function monX(m){ const X={atkP:0,hpP:0,mag:0,mana:0,critC:0,critD:0,spd:0,regen:0,steal:0,gold:0,exp:0,thorns:0,cdr:0,elDmg:{},elRes:{}};
  if(!m.eq||!G.inv) return X; for(const s in m.eq){ const it=G.inv.find(x=>x.id===m.eq[s]); if(!it||itemBroken(it)) continue;
    for(const md of itemMods(it)){ if(md.k==='elDmg'||md.k==='elRes') X[md.k][md.el]=(X[md.k][md.el]||0)+md.v; else if(md.k in X) X[md.k]+=md.v; } }
  X.cdr=Math.min(.4,X.cdr); X.critC=Math.min(.6,X.critC); X.steal=Math.min(.35,X.steal); for(const e in X.elRes) X.elRes[e]=Math.min(.75,X.elRes[e]); return X; }
const _monStats=monStats;
monStats=function(m){ const st=_monStats(m); if(!m.eq) return st; const X=monX(m); st.hp=Math.round(st.hp*(1+X.hpP)); st.atk*=1+X.atkP; st.spd=Math.min(2.2,st.spd*(1+X.spd)); st.eva=Math.min(.6,st.eva); return st; };
// keausan
function wearEq(m,kind,n){ if(!m.eq) return; n=n||1;
  for(const s in m.eq){ const it=G.inv.find(x=>x.id===m.eq[s]); if(!it) continue; itFix(it); if(it.dur<=0) continue;
    const p=kind==='die'?1:kind==='atk'?(s==='senjata'?.1:s==='aksesori'?.04:0):(s==='zirah'?.1:s==='aksesori'?.04:0);
    if(rnd()<p){ it.dur=Math.max(0,it.dur-n); if(it.dur===0){ log(`${it.n} milik ${m.name} rusak! Perbaiki di gudang supaya efeknya kembali.`,'warn'); if(typeof miraTip==='function') miraTip('Yang Mulia, ada perlengkapan yang rusak. Bawa ke Gudang dan tekan Perbaiki ya~','broken'); } } } }
function repairCost(it){ itFix(it); return Math.ceil((it.durMax-it.dur)*2*(1+it.r)); }
function repairItem(it){ const c=repairCost(it); if(!c) return 'Masih utuh.'; if(G.gold<c) return `Emas kurang (butuh ${c}).`; G.gold-=c; it.dur=it.durMax; return null; }
function repairAll(){ let c=0; for(const it of G.inv) c+=repairCost(it); if(!c) return 'Semua masih utuh.'; if(G.gold<c) return `Emas kurang (butuh ${c}).`; G.gold-=c; for(const it of G.inv) it.dur=it.durMax; return null; }
const _forgeItem=forgeItem;
forgeItem=function(it){ const e=_forgeItem(it); if(!e){ itFix(it); it.durMax+=5; it.dur=Math.min(it.durMax,it.dur+5); } return e; };
const _itemValue=itemValue;
itemValue=function(it){ itFix(it); return Math.round(_itemValue(it)*(1+it.mods.length*.25+it.runes.length*.3)); };
const _sellItem=sellItem;
sellItem=function(it){ itFix(it); G.runes=G.runes||[]; for(const rn of it.runes) G.runes.push(newRune(rn.g,rn.k)); it.runes=[]; _sellItem(it); };
function socketRune(it,rid){ itFix(it); if(it.runes.length>=it.sock) return 'Slot rune penuh.'; const i=(G.runes||[]).findIndex(r=>r.id===rid); if(i<0) return 'Rune tidak ada.';
  const rn=G.runes.splice(i,1)[0]; it.runes.push({k:rn.k,g:rn.g}); return null; }
function unsocketRune(it,idx){ itFix(it); const c=100; if(G.gold<c) return `Emas kurang (butuh ${c}).`; const rn=it.runes.splice(idx,1)[0]; if(!rn) return 'Tidak ada rune.'; G.gold-=c; addRune(rn.g,rn.k); return null; }
function mergeRunes(k,g){ G.runes=G.runes||[]; if(g>=5) return 'Sudah tingkat tertinggi.'; const same=G.runes.filter(r=>r.k===k&&r.g===g); if(same.length<3) return 'Butuh 3 rune yang sama.';
  const c=80*g; if(G.gold<c) return `Emas kurang (butuh ${c}).`; G.gold-=c; const ids=new Set(same.slice(0,3).map(r=>r.id)); G.runes=G.runes.filter(r=>!ids.has(r.id)); return addRune(g+1,k); }
function buyRune(){ const c=300; if(G.gold<c) return `Emas kurang (butuh ${c}).`; G.gold-=c; return addRune(rnd()<.2?2:1); }
function addSocket(it){ itFix(it); if(it.sock>=3) return 'Slot sudah maksimal (3).'; const c=Math.round(400*(it.sock+1)*(1+it.r*.5)); if(G.gold<c) return `Emas kurang (butuh ${c}).`; G.gold-=c; it.sock++; return null; }
function addSocketCost(it){ itFix(it); return Math.round(400*(it.sock+1)*(1+it.r*.5)); }
// bias affix per kelas petualang (perlengkapan khas kelas)
function jobBias(job){ const J=JOBS[job]; if(J.magic) return ['mag','elDmg','cdr','mana','elRes']; if(J.rng>20) return ['critC','critD','spd','eva','atkP'];
  if(J.front>=3) return ['def','hp','hpP','thorns','regen','elRes']; return ['atk','atkP','critC','critD','steal','spd']; }

function newParty(){

  else if(G.pop<30&&r<.55||r<.3){ tier='baru'; size=ri(2,4); lv=ri(1,8)+L*.15; }
  else if(r<.72){ tier='biasa'; size=ri(3,5); lv=L*rand(.75,1.1); }
  else if(r<.92){ tier='veteran'; size=ri(3,5); lv=L*rand(1.15,1.5); }
  else { tier='elite'; size=ri(4,5); lv=L*rand(1.5,1.9); }
  const pa={id:nid(),tier,members:[],state:'town',saveFloor:0,nextVisit:0,visits:0,wins:0,name:'',quote:''};
  let th=null;
  if(tier!=='solo'&&rnd()<.55){ const cand=PARTY_THEME.filter(t=>!t.tier||t.tier===tier||(t.tier==='baru')===(tier==='baru')&&rnd()<.3); th=pick(cand.length?cand:PARTY_THEME); }

  else if(th&&th.j){ for(let i=0;i<size;i++) jobs.push(th.fixed?th.j[i%th.j.length]:pick(th.j)); }
  else { const core=size>=3&&rnd()<.5?['knight','priest',pick(['mage','archer'])]:[]; for(let i=0;i<size;i++) jobs.push(core[i]||pickJobStar(tier)); }
  for(const [ji,j] of jobs.entries()){ const race=th&&th.races?th.races[ji]:th&&th.race?(th.raceAll||rnd()<.85?th.race:null):null; const p=newPerson(Math.max(1,lv+ri(-3,3)),tier==='solo'?pickJobStar('solo'):j,race||undefined); p.party=pa.id; pa.members.push(p.id);
    if(th&&th.old){ p.app.hair=pick(['#c8c4c0','#e8e4e0','#a8a4a0']); p.sx='m'; }
    if(th&&th.sx&&p.sx!==th.sx){ for(let k=0;k<12;k++){ const a=advName(p.race); if(a.sx===th.sx){ p.name=a.n; p.sx=a.sx; break; } } } }
  // orang dunia lain di dalam party
  const isekaiP=tier==='solo'?.25:tier==='baru'?.05:.08;
  if(th&&th.isekaiLead){ const p=G.people[pa.members[0]]; const jb=p.job; makeIsekai(p,0); p.job=jb; p.title='the '+JOBS[jb].n; }
  else if(rnd()<isekaiP&&!(th&&th.race)){ const p=G.people[pick(pa.members)]; makeIsekai(p,th&&th.j?0:3); }
  const lead=G.people[pa.members[0]];
  if(tier==='solo'){ const p=lead; if(!p.isekai) p.title=`the ${pick(EPI_ADJ)} ${EPI_JOB[p.job]||JOBS[p.job].n}`; else p.title=`the Wandering Otherworlder`; pa.name=`${p.name} ${p.title}`; }
  else if(th){ pa.name=fillName(pick(th.n),lead); if(th.lead&&!lead.isekai) lead.title=th.lead; if(th.id==='trash'&&G.parties.some(x=>x!==pa&&x.name==='Trash Game'&&x.state!=='gone')) pa.name='Trash Game II'; }
  else if(tier==='baru') pa.name=rnd()<.35?'Newcomer Party':genPartyName();
  else pa.name=genPartyName();
  G.parties.push(pa); return pa;
}

  if(offer.k==='gold'){ const pr=nbTradePrice(nb,their).gold; if(G.gold<pr) return {ok:false,msg:`Emas kurang (butuh ${pr}).`}; ok=!(nb.pers==='sombong'&&nb.rel<10&&rnd()<.5); if(ok){ G.gold-=pr; nb.w.gold+=pr; } give=`${pr} emas`; }
  else if(offer.k==='jiwa'){ const pr=nbTradePrice(nb,their).jiwa; if(G.jiwa<pr) return {ok:false,msg:`Kristal Jiwa kurang (butuh ${pr}).`}; ok=!(nb.pers==='sombong'&&nb.rel<10&&rnd()<.5); if(ok){ G.jiwa-=pr; nb.w.jiwa+=pr; } give=`${pr} Kristal Jiwa`; }
  else { const m=offer.m; if(!m||m.floor>=0) return {ok:false,msg:'Pilih monster dari cadangan.'}; const ov=monValue(m)*(monFitsNeed(m,nb.need)?1.3:1); ok=ov>=tv*ask*rand(.9,1.1); give=`${m.name} si ${SPECIES[m.sp].n}`;

  for(const i of mark){ d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=255; }

  g.fillStyle=T.wall; g.fillRect(0,0,FW,FH);
  let seed=ti*97+3; const r=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let y=4;y<FH-8;y+=7){ const off=(y/7)%2?0:9; for(let x=-off;x<FW;x+=18){ g.fillStyle=r()<.5?T.wall2:shade(T.wall,.06); g.fillRect(x+1,y+1,16,5); } }
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,0,FW,4);
  g.fillStyle=T.floor; g.fillRect(0,FH-8,FW,8); g.fillStyle=shade(T.floor,.18); g.fillRect(0,FH-8,FW,1); g.fillStyle=shade(T.floor,-.25); g.fillRect(0,FH-2,FW,2);
  for(let x=4;x<FW;x+=12){ g.fillStyle=shade(T.floor,-.12); g.fillRect(x,FH-5,6,1); }
  if(ti===2){ for(let i=0;i<9;i++){ const x=r()*FW; g.fillStyle=T.acc; g.fillRect(x,FH-11,2,3); g.fillStyle='#e86a8a'; g.fillRect(x-1,FH-13,4,2); } }
  if(ti===3){ for(let i=0;i<7;i++){ const x=r()*FW, y=6+r()*28; g.fillStyle=T.acc; g.fillRect(x,y,2,5); g.fillRect(x-1,y+2,4,1); } }
  if(ti===4){ for(let i=0;i<6;i++){ const x=r()*FW; g.fillStyle='#ff7a3a'; g.fillRect(x,FH-8,8,1); } }
  if(ti===5){ for(let x=6;x<FW;x+=22){ g.fillStyle='#d8f4ff'; g.fillRect(x,4,1,4); g.fillRect(x+1,4,1,2); } }
  return c;
}

function pickAtCanvas(cx,cy){
  const s=RC.s; const wx=cx/s, wy=cy/s+RC.camY;
  let f=-1; for(let i=0;i<G.floors;i++){ const t=floorTop(i); if(wy>=t&&wy<t+FH){ f=i; break; } }
  if(f<0) return null;
  const base=floorBase(f);
  if(!UI.placing){ let best=null,bd=10;
    for(const a of G.advs) if(a.floor===f){ const d=Math.abs(a.x-wx); if(d<bd&&wy>base-34&&wy<base+4){ bd=d; best={k:'a',id:a.pid}; } }
    for(const m of G.mons) if(m.floor===f){ const x=m.dead?m.px:m.x; const d=Math.abs(x-wx); if(d<bd&&wy>base-34&&wy<base+4){ bd=d; best={k:'m',id:m.id}; } }
    if(f===topF()&&Math.abs(G.lord.x-wx)<12&&wy>base-40) best={k:'l'};
    if(best) return best; }
  let si=-1,sd=9; for(let i=0;i<SLOTS;i++){ const d=Math.abs(SLOT_X(i)-wx); if(d<sd){ sd=d; si=i; } }
  if(si>=0) return {k:'slot',f,i:si};
  return {k:'floor',f};
}
function initCanvas(cv){
  RC.cv=cv; RC.g=cv.getContext('2d');

  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); down={y:e.clientY,x:e.clientX,cam:RC.camY,moved:false}; });
  cv.addEventListener('pointermove',e=>{ if(!down) return; const dy=e.clientY-down.y; if(Math.abs(dy)>6) down.moved=true; if(down.moved){ const dpr=cv.width/cv.getBoundingClientRect().width; RC.camY=down.cam-dy*dpr/RC.s; RC.follow=false; } });

}

    case 'whip': o.ang=-60+200*ease(p); o.dx=Math.sin(p*Math.PI)*2; break;
    case 'throw': o.ang=-100+200*ease(p); o.dx=Math.sin(p*Math.PI)*2; break;
    case 'gunshot': o.ang=90-Math.sin(p*Math.PI)*20; o.dx=-Math.sin(p*Math.PI)*2; o.glow=p<.25?1:0; break;

function act(a,el){
  let err=null;

  else if(a==='autoEqAll'){ const n=autoEquipAll(); toast(n?`${n} perlengkapan dipasang otomatis.`:'Tidak ada perlengkapan menganggur yang lebih baik.'); }
  else if(a==='autoEq'&&m){ const n=autoEquipMon(m); toast(n?`${m.name} memakai ${n} perlengkapan terbaik.`:'Tidak ada perlengkapan menganggur yang lebih baik.'); }
  else if(a==='floor'){ err=buyFloor(); if(!err){ toast(`Lantai ${G.floors} dibangun!`); scrollToFloor(topF()); } }
  else if(a==='rename'&&m){ const v=$('nmIn').value; const r=askRename(m,v); if(r.msg) toast(r.msg); else { UI.rnReply={id:m.id,ok:r.ok,reply:r.reply,alt:r.alt}; UI.nmDraft=r.ok?null:{id:m.id,v}; if(m.floor>=0) say(m.x,m.floor,r.ok?'♪':'Hmph!',r.ok?'#9fff9a':'#ff9aa8',1.2); if(r.ok) log(`${r.old} setuju dipanggil ${m.name} mulai sekarang.`,'evo'); } }

  else if(a==='gift'&&m){ if(G.gold<40) err='Emas kurang.'; else { G.gold-=40; m.loy=Math.min(100,m.loy+12); monGainExp(m,monNeed(m)*.1); toast(`${m.name} senang sekali!`); if(m.floor>=0) say(m.x,m.floor,'♥','#ff7ab0',1.4); } }
  else if(a==='train'&&m){ err=trainMon(m); if(!err) toast(`${m.name} berlatih keras.`); }
  else if(a==='fuse'&&m){ UI.fuseA=UI.fuseA===m.id?null:m.id; UI.fuseB=null; }
  else if(a==='fuseNo'){ UI.fuseB=null; }
  else if(a==='tabGudang'){ openPanel('gudang'); return; }
  else if(a==='tabMon'){ openPanel('monster'); return; }

  else if(a==='skipLearn'&&m){ skipLearn(m); }
  else if(a==='buyRune'){ const r=buyRune(); if(typeof r==='string') err=r; else toast(`Dapat ${runeName(r)}!`); }
  else if(a==='repairAll'){ const r=repairAll(); if(r) err=r; else toast('Semua perlengkapan diperbaiki.'); }
  else if(a==='buyItem'){ const r=buyItem(); if(typeof r==='string') err=r; else toast(`Dapat ${r.n} (${RARITY[r.r]})!`); }
  else if(a==='fuseGo'&&m){ const b=G.mons.find(x=>x.id===UI.fuseB); if(b){ err=fuseMons(m,b); if(!err){ toast('Fusi berhasil!'); UI.fuseB=null; UI.fuseA=null; } } }
  else if(a==='release'&&m) UI.confirmRel=m.id;
  else if(a==='releaseNo') UI.confirmRel=null;
  else if(a==='releaseGo'&&m){ if(m.secret) clearSecret(m); G.mons=G.mons.filter(x=>x!==m); UI.confirmRel=null; toast(`${m.name} kembali ke alam liar.`); openPanel('monster'); return; }
  else if(a==='unsecret'&&m){ clearSecret(m); toast(`${m.name} keluar dari ruang rahasia.`); }
  else if(a==='trapUp'){ err=upgradeTrap(UI.sel.f,UI.sel.i); }
  else if(a==='sell'){ removeFix(UI.sel.f,UI.sel.i); closePanel(); toast('Dibongkar.'); return; }
  else if(a==='move'){ const s=UI.sel; closePanel(); UI.placing={move:{f:s.f,i:s.i},t:'_'}; $('placebar').hidden=false; $('placeTxt').textContent='Ketuk petak kosong tujuan.'; return; }

  else if(a==='newgame') UI.confirmNew=true;
  else if(a==='newgameNo') UI.confirmNew=false;
  else if(a==='newgameGo'){ UI.confirmNew=false; EFX.length=0; TIMERS.length=0; newGame(); saveGame(); closePanel(); $('ticker').innerHTML=''; scrollToFloor(0); toast('Kastil baru berdiri.'); return; }
  if(err) toast(err);
  renderPanel();
}
function onCanvasTap(hit){

function followCam(dt){
  if(!RC.follow) return;
  let f=null; for(const a of G.advs) if(f==null||a.floor>f) f=a.floor;
  if(f==null) f=G.assist.q.length?G.assist.f:0;
  const vh=(RC.h-(RC.padB||0))/RC.s; const goal=clamp(floorTop(f)+FH/2-vh*.45,Math.min(0,worldH()-vh),Math.max(0,worldH()-vh));
  RC.camY+=(goal-RC.camY)*Math.min(1,dt*2.5);
}
/* ---------- loop ---------- */
let lastT=0, acc=0, saveAcc=0, hudAcc=0;
function frame(ts){
  const real=Math.min(.25,(ts-(lastT||ts))/1000); lastT=ts;
  acc+=real*(SCENE_PANELS.includes(UI.panel)?0:UI.speed); let n=0; while(acc>=DT&&n<40){ step(); acc-=DT; n++; } if(n>=40) acc=0;
  { const sh=$('sheet'); RC.padB=sh.hidden?0:sh.offsetHeight*(RC.cv.width/RC.cv.getBoundingClientRect().width); }
  for(let i=EFX.length-1;i>=0;i--){ EFX[i].t-=real*(UI.speed?Math.min(UI.speed,1.5):0); if(EFX[i].t<=0) EFX.splice(i,1); }
  followCam(real); render();
  hudAcc+=real; if(hudAcc>.25){ hudAcc=0; updateHUD(); }
  if(UI.panel&&['mon','petualang','raja','adv','fix','tetangga','nmon'].includes(UI.panel)&&performance.now()-UI.lastRefresh>1000&&!(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName))) renderPanel();
  saveAcc+=real; if(saveAcc>15){ saveAcc=0; saveGame(); }
  requestAnimationFrame(frame);
}
function boot(data){
  if(data&&data.G){ G=data.G; } else if(!loadGame()) newGame();
  initCanvas($('cv')); bindUI(); updateHUD(); miraTip('Selamat datang, Yang Mulia! Ketuk petak kosong untuk memasang jebakan atau peti. Ketuk saya kapan saja untuk laporan kastil.','welcome');
  scrollToFloor(0);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveGame(); });
  window.claude?.hot?.snapshot?.(()=>({G}));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

function nwMakeAuction(){ const L=fameLv(); const bidders=[]; const add=(title,p,nbId)=>{ const b={i:bidders.length,title,p,nb:nbId==null?null:nbId,name:p?p.name:title}; bidders.push(b); return b; };

function nwBuy(n,vi,si){ const v=n.data.vendors[vi]; const s=v&&v.stock[si]; if(!s||s.sold) return 'Sudah terjual.'; if(G.gold<s.p) return `Emas kurang (butuh ${s.p}).`; G.gold-=s.p; s.sold=1;

  h+=`<div class="btns"><button class="btn pri" data-act="nw:smsock" ${S.item&&S.rune?'':'disabled'}>Pasang rune</button></div></div>`;
  if(UI.smRes){ const it=G.inv.find(x=>x.id===UI.smRes); if(it) h+=`<div class="party"><b>Hasil: ${itemName(it)} ${rarTag(it.r)}</b><span class="note">${itemShort(it)}</span></div>`; }
  return {t:'Penempa',h:h+`<div class="btns" style="margin-top:8px"><button class="btn" data-act="nw:leave">Kembali ke kastil</button></div>`}; }
NB_PANELS.berita=pBerita; NB_PANELS.bdetail=pBDetail; NB_PANELS.bpasar=pPasar; NB_PANELS.blelang=pLelang; NB_PANELS.btempa=pTempa;
const _nwAR=nbAfterRender; nbAfterRender=function(B){ _nwAR(B); for(const cv of B.querySelectorAll('canvas[data-npq]')){ const p=NPQ[+cv.dataset.npq]; if(p&&JOBS[p.job]) iconSpr(cv,advSpr(p,0)); } NPQ.length=0; };
(function nwUIInit(){
  const st=document.createElement('style'); st.textContent=`nav{grid-template-columns:repeat(7,minmax(0,1fr))!important}`; document.head.appendChild(st);
  const nav=$('nav'); const b=document.createElement('button'); b.dataset.p='berita'; const c=document.createElement('canvas'); c.width=32; c.height=36; b.appendChild(c); b.appendChild(document.createTextNode('Berita')); nav.appendChild(b);
  paintIcon(c,g=>{ g.fillStyle='#e8dcc0'; g.fillRect(6,8,20,20); g.fillStyle='#8a7a5a'; g.fillRect(6,8,20,3); g.fillStyle='#6a5a3a'; g.fillRect(9,14,14,2); g.fillRect(9,18,14,2); g.fillRect(9,22,9,2); g.fillStyle='#c04a4a'; g.fillRect(20,21,5,5); });
  b.onclick=()=>{ if(UI.panel==='berita'||UI.panel==='bdetail'){ closePanel(); return; } UI.target=null; openPanel('berita'); };
  setInterval(()=>{ if(G&&!G.isNeighbor) nwBadge(); },1000); nwBadge();
})();

/* ---- tetangga lebih pintar: pasang semua monster, urut kuat, auto pasang perlengkapan terbaik ---- */
function nbSmart(){ if(!G.isNeighbor) return; const ms=G.mons.filter(m=>!m.temp&&!m.secret); if(!ms.length) return; const F=G.floors;
  const sig=ms.length+'|'+ms.reduce((a,m)=>a+m.lv,0)+'|'+F+'|'+ms.filter(m=>m.floor<0).length; if(G.nbSig===sig) return;
  const pw=m=>{ const s=monStats(m); return Math.sqrt(s.hp*s.atk); }; const sorted=ms.slice().sort((a,b)=>pw(a)-pw(b)); const per=Math.max(1,Math.min(FLOOR_CAP,Math.ceil(sorted.length/F)));
  sorted.forEach((m,i)=>{ const f=i>=F*FLOOR_CAP?-1:Math.min(F-1,Math.floor(i/per)); if(m.floor!==f){ m.floor=f; if(f>=0){ m.px=SLOT_X(ri(1,8)); m.x=m.px; } } });
  G.nbSig=ms.length+'|'+ms.reduce((a,m)=>a+m.lv,0)+'|'+F+'|'+ms.filter(m=>m.floor<0).length; }
function nbGear(){ if(!G.isNeighbor) return; const free=G.inv.filter(x=>!x.on).length; const nm=G.mons.filter(m=>!m.temp).length;
  for(let k=0;k<3&&G.inv.filter(x=>!x.on).length<Math.min(8,nm*2);k++){ if(G.gold>=250&&rnd()<.7) buyItem(); else if(rnd()<.3) genItem(Math.max(1,fameLv()*.6),null,{preRune:.15}); }
  autoEquipAll(); }
const _nwNbAI=nbAI; nbAI=function(){ _nwNbAI(); nbSmart(); nbGear(); };
function nbBoost(nb){ withWorld(nb.w,()=>{ if(!G.isNeighbor) return; for(let i=0;i<3;i++) genItem(Math.max(1,fameLv()*.6),null,{preRune:.15}); G.nbSig=null; nbSmart(); autoEquipAll(); }); }
const _nwGive=nbGiveMon; nbGiveMon=function(nb,m){ const r=_nwGive(nb,m); if(!r) nbBoost(nb); return r; };
const _nwTrade=nbTrade; nbTrade=function(nb,their,offer){ const r=_nwTrade(nb,their,offer); if(r&&r.ok) nbBoost(nb); return r; };
