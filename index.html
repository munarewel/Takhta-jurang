:root{

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

header{display:flex;flex-direction:column;gap:5px;padding-block:7px 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--stone2);border-bottom:2px solid var(--line)}
.row1{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
.day{font-family:var(--display);font-size:13px;color:var(--mute)}

.spd button{background:var(--stone);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-family:var(--display);font-size:13px;color:var(--mute);min-width:32px}
.spd button[aria-pressed="true"]{color:var(--night);background:var(--gold);border-color:var(--gold)}

.stage{position:relative;min-height:0;overflow:hidden;background:#0b0812;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

.side{position:absolute;right:8px;bottom:62px;display:flex;flex-direction:column;gap:5px}
.side button{width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:rgba(23,18,32,.92);font-family:var(--display);font-size:12px;color:var(--bone)}

.sheet-h{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:17px;color:var(--gold);letter-spacing:.03em}

.sec h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

.card .ic{width:34px;height:38px;flex:0 0 auto;image-rendering:pixelated}

.btn.warn{border-color:var(--blood);color:#ff9aa8}

.kv dt{color:var(--mute)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--stone);border-radius:3px;overflow:hidden;border:1px solid var(--line)}

  if(['golemX','robot','drone'].includes(k)) return 'mesin';

}

  let h=hashStr(sid); const pickd=[]; const p=pool.slice(); const n=s.stage>=3?3:2+(s.rar>=2?1:0);
  while(pickd.length<n&&p.length){ h=Math.imul(h^(h>>>13),1274126177)>>>0; pickd.push(p.splice(h%p.length,1)[0]); }
  const cap=STAGE_CAP[s.stage]||25; const fr=[.3,.6,.9];
  s._learn=[{ab:s.ab,lv:1}].concat(pickd.map((a,i)=>({ab:a,lv:Math.max(2,Math.round(cap*fr[i]))}))); return s._learn;
}

const ROOTS=Object.keys(MON).filter(k=>{ const m=MON[k]; return !SKIP_MON.has(k)&&!m.evolved&&!(EVO_PREV[k]&&monStage(k)>1); });
const SPECIES={}; let SPECIES_N=0;
function rankRar(rank){ const i=RANK_ORDER.indexOf(rank); return i<=1?0:i<=3?1:i===4?2:i===5?3:4; }

  return s;
}

function lordRace(){ return LORD_RACE.find(r=>r.id===G.lord.race)||LORD_RACE[0]; }
function monStats(m){
  const s=SPECIES[m.sp]; const lf=.85+m.loy*.003;
  const lr=G&&G.lord?G.lord.race:''; const rg=G&&G.rage>G.t?1.3:1;
  let hp=s.hp*2.2*(1+.12*(m.lv-1))*m.boost*lf, atk=s.atk*2*(1+.1*(m.lv-1))*m.boost*lf*(lr==='iblis'?1.1:1)*rg;
  let def=(RANK_ORDER.indexOf(s.rank)*2+m.lv*.6)*(m.abil.includes('kulitBatu')?1.35:1);
  let eva=.03+(m.abil.includes('gesit')?.15:0)+(m.abil.includes('licin')?.1:0)+(s.el==='bayang'?.04:0)+floorKabut(m.floor);
  const E=eqBonus(m); hp+=E.hp; atk+=E.atk; def+=E.def; eva+=E.eva;
  return {hp:Math.round(hp),atk,def,eva,spd:Math.min(1.6,.6+s.spd*.5),rng:s.ranged?40:13};
}
function itemStats(it){ const k=1+(it.lv||0)*.12; return {atk:(it.atk||0)*k,hp:(it.hp||0)*k,def:(it.def||0)*k,eva:(it.eva||0)}; }
function eqBonus(m){ const o={atk:0,hp:0,def:0,eva:0}; if(!m.eq||!G||!G.inv) return o; for(const s in m.eq){ const it=G.inv.find(x=>x.id===m.eq[s]); if(!it) continue; const st=itemStats(it); o.atk+=st.atk; o.hp+=st.hp; o.def+=st.def; o.eva+=st.eva; } return o; }
function genItem(lv,minR,opt){
  opt=opt||{}; const slot=opt.s||pick(Object.keys(EQ_SLOT)); let r=0; const x=rnd()+Math.min(.5,lv/200); r=x>1.18?4:x>1.02?3:x>.85?2:x>.6?1:0; if(minR!=null) r=Math.max(r,minR);
  const base=1+lv*.5, mul=1+r*.55;
  const it={id:nid(),s:slot,r,lv:0,n:opt.n||(EQ_PRE[Math.min(EQ_PRE.length-1,r*2+ri(0,1))]+pick(EQ_NAMES[slot])),on:null}; if(opt.from) it.from=opt.from;
  if(slot==='senjata'){ it.atk=+(base*1.1*mul).toFixed(1); }
  else if(slot==='zirah'){ it.hp=Math.round((12+lv*4)*mul); it.def=+((1+lv*.3)*mul).toFixed(1); }
  else { it.eva=+(.02+r*.012).toFixed(3); it.atk=+(base*.35*mul).toFixed(1); it.hp=Math.round((5+lv*1.5)*mul); }
  G.inv.push(it); return it;
}
function itemValue(it){ return Math.round(30*(1+it.r*1.6)*(1+(it.lv||0)*.5)); }
function equipItem(m,it){ if(!it) return 'Barang tidak ada.'; m.eq=m.eq||{}; if(it.on&&it.on!==m.id){ const o=G.mons.find(x=>x.id===it.on); if(o&&o.eq) delete o.eq[it.s]; }
  const old=m.eq[it.s]&&G.inv.find(x=>x.id===m.eq[it.s]); if(old) old.on=null; m.eq[it.s]=it.id; it.on=m.id; return null; }
function unequip(m,slot){ if(!m.eq||!m.eq[slot]) return; const it=G.inv.find(x=>x.id===m.eq[slot]); if(it) it.on=null; delete m.eq[slot]; }
function tierOf(n){ G.bahanT=G.bahanT||{}; if(G.bahanT[n]!=null) return G.bahanT[n]; const i=BAHAN.indexOf(n); return i>=0?i:0; }
function addBahan(n,t){ G.bahan[n]=(G.bahan[n]||0)+1; G.bahanT=G.bahanT||{}; if(t!=null) G.bahanT[n]=t; }
function forgeCost(it){ return {gold:Math.round(60*(it.lv+1)*(it.r+1)),tier:Math.min(6,it.r+Math.floor(it.lv/4)),n:1+Math.floor(it.lv/2)}; }
function bahanAvail(t){ return Object.entries(G.bahan).filter(([n,c])=>c>0&&tierOf(n)>=t).reduce((s,[n,c])=>s+c,0); }
function forgeItem(it){ if(it.lv>=10) return 'Sudah +10.'; const c=forgeCost(it); if(G.gold<c.gold) return `Emas kurang (butuh ${c.gold}).`; if(bahanAvail(c.tier)<c.n) return `Butuh ${c.n} bahan tingkat ${c.tier+1} ke atas.`;
  G.gold-=c.gold; let need=c.n; for(const [n] of Object.entries(G.bahan).filter(([n,v])=>v>0&&tierOf(n)>=c.tier).sort((a,b)=>tierOf(a[0])-tierOf(b[0]))){ while(need>0&&G.bahan[n]>0){ G.bahan[n]--; need--; } if(!need) break; } it.lv++; return null; }
function sellItem(it){ if(it.on){ const m=G.mons.find(x=>x.id===it.on); if(m) unequip(m,it.s); } G.inv=G.inv.filter(x=>x!==it); G.gold+=itemValue(it); }
function buyItem(){ const c=250; if(G.gold<c) return `Emas kurang (butuh ${c}).`; G.gold-=c; return genItem(Math.max(1,fameLv()*.6)); }
function advDrops(p,a,hero){
  const out=[];
  if(rnd()<.2){ const b=BAHAN[Math.min(BAHAN.length-1,Math.floor(p.lv/12)+(rnd()<.15?1:0))]; addBahan(b); out.push(b); }
  // barang bawaan (hasil rampasan dari monster kita) kembali ke kastil
  const got=[]; for(const e of p.bag||[]){ if(e.k==='eq'){ const it=genItem(e.lv,e.r,{s:e.s,n:e.n,from:e.from}); it.r=e.r; got.push(it.n+' ('+RARITY[it.r]+')'); } else { addBahan(e.n,e.t); got.push(e.n); } }
  if(got.length){ out.push(got[0]); if(got.length>1||(p.bag||[]).some(e=>e.k!=='mat')) log(`Dari jasad ${p.name}, Mira memungut ${got.slice(0,4).join(', ')}${got.length>4?', …':''} untuk gudang.`,'evo'); } p.bag=[];
  if(hero||rnd()<.05+p.lv*.0015){ const it=genItem(p.lv,hero?3:null); out.push(it.n); if(it.r>=3||hero) log(`${p.name} menjatuhkan ${it.n} (${RARITY[it.r]})! Barang masuk ke gudang kastil.`,'evo'); }
  if(out.length) say(a.x,a.floor,'+'+out[out.length-1],'#c8f0a0',1.6);
}
function floorKabut(f){ return G.mons.some(o=>!o.dead&&o.floor===f&&o.abil.includes('kabut'))?.08:0; }
function lordStats(){ const L=G.lord; const r=L.race;
  return {hp:Math.round((760+L.lv*72)*(1+G.floors*.08)*(r==='orc'?1.4:1)),atk:(20+L.lv*3)*(r==='oni'?1.4:1),def:(4+L.lv*1.1)*(r==='ksatria'?1.5:1),eva:.04,rng:r==='naga'?40:15}; }
function advStats(p){ const J=JOBS[p.job]; return {hp:Math.round(J.hp+J.grow[0]*(p.lv-1)+p.eq.hp),atk:J.atk+J.grow[1]*(p.lv-1)+p.eq.atk,def:J.def+J.grow[2]*(p.lv-1)+p.eq.def,eva:J.eva+Math.min(.12,p.lv*.0012),rng:J.rng}; }

const OUTFITS=['tunik','tunik','rompi','mantel','kemeja','syal'];
const HAIRSTYLES=['short','short','long','tail','bun','braid','spiky'];
function newParty(){
  const L=fameLv(); const r=rnd();
  let tier, size, lv;
  const soloP=.02+Math.min(.06,G.pop/3000);
  if(r<soloP){ tier='solo'; size=1; lv=Math.max(30,L*2.4+ri(0,25)); }
  else if(G.pop<30&&r<.55||r<.3){ tier='baru'; size=ri(2,4); lv=ri(1,8)+L*.15; }
  else if(r<.72){ tier='biasa'; size=ri(3,5); lv=L*rand(.75,1.1); }
  else if(r<.92){ tier='veteran'; size=ri(3,5); lv=L*rand(1.15,1.5); }
  else { tier='elite'; size=ri(4,5); lv=L*rand(1.5,1.9); }
  const jobs=[]; const core=size>=3?['knight','priest',pick(['mage','archer'])]:[];
  for(let i=0;i<size;i++) jobs.push(core[i]||pick(JOB_KEYS));
  const pa={id:nid(),tier,members:[],state:'town',saveFloor:0,nextVisit:0,visits:0,wins:0,name:'',quote:''};
  for(const j of jobs){ const p=newPerson(Math.max(1,lv+ri(-3,3)),tier==='solo'?pick(['dualblade','knight','mage','lancer','monk','berserker']):j); p.party=pa.id; pa.members.push(p.id); }
  if(tier==='solo'){ const p=G.people[pa.members[0]]; p.title=`the ${pick(EPI_ADJ)} ${EPI_JOB[p.job]}`; pa.name=`${p.name} ${p.title}`; }

/* ---------- gacha ---------- */
const GACHA_ODDS=[.55,.28,.12,.045,.005];
function gachaRoll(minR){
  const luck=Math.min(.02,G.aura*.0004);
  let r=rnd(), acc=0, ri_=0; const odds=GACHA_ODDS.slice(); odds[3]+=luck; odds[0]-=luck;
  for(let i=0;i<odds.length;i++){ acc+=odds[i]; if(r<acc){ ri_=i; break; } }
  if(minR!=null) ri_=Math.max(ri_,minR);
  const pool=GACHA_POOL[RARITY[ri_]]; const sid=pick(pool);
  const m=addMonster(sid); G.stats.gacha++;
  autoPlace(m);
  return m;
}
function gacha(n,cur){
  const cost=cur==='gold'?n*350:(n===10?90:n*10);
  if(cur==='gold'?G.gold<cost:G.jiwa<cost) return {err:cur==='gold'?`Emas kurang (butuh ${cost}).`:`Kristal Jiwa kurang (butuh ${cost}).`};
  if(cur==='gold') G.gold-=cost; else G.jiwa-=cost;
  const out=[]; for(let i=0;i<n;i++) out.push(gachaRoll(n===10&&i===9&&!out.some(m=>SPECIES[m.sp].rar>=2)?2:null));
  const best=out.reduce((a,m)=>SPECIES[m.sp].rar>SPECIES[a.sp].rar?m:a,out[0]);
  if(SPECIES[best.sp].rar>=3) log(`Lingkaran pemanggilan bersinar ${RARITY[SPECIES[best.sp].rar]}! ${best.name} si ${SPECIES[best.sp].n} bergabung.`,'evo');
  return {out};
}
function floorCount(f){ return G.mons.filter(m=>m.floor===f&&!m.secret).length; }
const FLOOR_CAP=5;
function autoPlace(m){ for(let f=0;f<G.floors;f++){ if(floorCount(f)<FLOOR_CAP){ m.floor=f; m.px=SLOT_X(ri(1,8)); m.x=m.px; return; } } m.floor=-1; }

/* ---------- toko & bangun ---------- */
function floorCost(){ return Math.round(400*Math.pow(1.22,G.floors-3)); }
function buyFloor(){
  if(G.floors>=MAX_FLOORS) return 'Kastil sudah 100 lantai.';
  const c=floorCost(); if(G.gold<c) return `Emas kurang (butuh ${c}).`;
  G.gold-=c; G.floors++; G.fix.push(Array(SLOTS).fill(null));
  G.lord.x=fend(topF());
  log(`Kastil bertambah tinggi: kini ${G.floors} lantai. Singgasana pindah ke lantai ${G.floors} (${themeOf(topF()).n}).`,'sys');
  return null;
}
function fixCost(fx){ return fx.t==='chest'?chestCost(fx.r):FIX[fx.t].cost; }
function orderPlace(f,slot,fx){
  if(G.fix[f][slot]) return 'Petak itu sudah terisi.';
  if(G.assist.q.some(q=>q.f===f&&q.slot===slot)) return 'Mira sudah menuju petak itu.';
  const c=fixCost(fx); if(G.gold<c) return `Emas kurang (butuh ${c}).`;
  G.gold-=c; G.assist.q.push({f,slot,fx}); return null;
}
function removeFix(f,slot){ const fx=G.fix[f][slot]; if(!fx) return; if(fx.t==='rahasia'){ for(const m of secretMons(fx)){ m.secret=null; m.px=SLOT_X(ri(1,8)); } }
  if(fx.t!=='chest') G.gold+=Math.round(fixCost(fx)*.5); G.fix[f][slot]=null; recalcAura(); }
function moveFix(f,i,f2,i2){ const fx=G.fix[f]&&G.fix[f][i]; if(!fx) return 'Tidak ada yang dipindah.'; if(G.fix[f2][i2]) return 'Petak tujuan terisi.';
  G.fix[f][i]=null; G.fix[f2][i2]=fx; if(fx.t==='rahasia'){ fx.found=false; secretMons(fx).forEach((m,k)=>{ m.secret={f:f2,slot:i2}; m.floor=f2; }); }
  G.assist.f=f2; G.assist.x=SLOT_X(i2); fxAt('spark',SLOT_X(i2),f2,'#ff9ad0',.6); say(SLOT_X(i2),f2,'Pindah!','#ff9ad0',1); return null; }
function recalcAura(){ let a=0; for(const row of G.fix) for(const x of row) if(x&&FIX[x.t]&&FIX[x.t].aura) a+=FIX[x.t].aura; G.aura=a; }
function assistTick(dt){
  const A=G.assist; const q=A.q[0];
  if(!q){ A.busy=0; const tx=FW/2+Math.sin(G.t*.3)*40; A.x+=(tx-A.x)*dt*.5; A.f=topF(); return; }
  if(A.f!==q.f){ A.fly=(A.fly||0)+dt; if(A.fly>.5){ A.f+=q.f>A.f?1:-1; A.fly=0; } return; }
  const tx=SLOT_X(q.slot); const d=tx-A.x;
  if(Math.abs(d)>2){ A.x+=Math.sign(d)*Math.min(Math.abs(d),55*dt); A.dir=Math.sign(d); return; }
  A.busy+=dt; if(Math.floor(A.busy*6)%2) fxAt('spark',A.x+ri(-6,6),A.f,'#ff9ad0',.4);
  if(A.busy>=1.1){ A.busy=0; A.q.shift(); if(!G.fix[q.f][q.slot]){ G.fix[q.f][q.slot]=q.fx; recalcAura(); say(tx,q.f,'Terpasang!','#ff9ad0',1.2); } else G.gold+=fixCost(q.fx); }
}

/* ---------- AI petualang ---------- */
function enemiesOn(f){ const out=[]; for(const m of G.mons) if(!m.dead&&m.floor===f&&!m.hidden&&!(m.secret&&!secretFound(m))) out.push(m); return out; }
function secretFound(m){ const fx=G.fix[m.secret.f]&&G.fix[m.secret.f][m.secret.slot]; return fx&&fx.found; }
function advTick(a,dt){
  const p=G.people[a.pid]; if(!p){ G.advs=G.advs.filter(x=>x!==a); return; }
  const pa=G.parties.find(x=>x.id===a.party); const J=JOBS[p.job]; const st=advStats(p);
  for(const k in a.cd) a.cd[k]-=dt;
  if(a.fx.burn>G.t&&Math.floor(G.t*2)!==Math.floor((G.t-dt)*2)) hitAdv(a,st.hp*.03,null,{sure:1,mult:1});
  if(a.fx.poison>G.t&&Math.floor(G.t)!==Math.floor(G.t-dt)) { a.hp-=Math.max(1,st.hp*(a.fx.poisonK>G.t?.045:.02)); if(a.hp<=0){ advDie(a,null); return; } }
  if(a.fx.stun>G.t||a.fx.sleep>G.t) return;
  if(a.resting){ a.resting-=dt; a.hp=Math.min(st.hp,a.hp+st.hp*.3*dt); if(a.resting<=0) a.resting=0; return; }
  if(a.opening){ a.opening-=dt; if(a.opening<=0){ a.opening=0; openChest(a,pa); } return; }
  const f=a.floor, dir=fdir(f);
  const foes=enemiesOn(f); const lordHere=f===topF()&&G.lord.hp>0;
  // cari target terdekat dalam jangkauan
  let tgt=null, td=1e9;
  for(const m of foes){ const d=Math.abs(m.x-a.x); if(d<td){ td=d; tgt={k:'m',u:m}; } }
  if(lordHere){ const d=Math.abs(G.lord.x-a.x); if(d<td){ td=d; tgt={k:'l',u:G.lord}; } }
  const charmed=a.fx.charm>G.t;
  if(tgt&&td<=st.rng+2&&!charmed){
    a.walk=0; a.face=Math.sign(tgt.u.x-a.x)||dir;
    if(a.cd.sk<=0){ useSkill(a,p,J,tgt,st,pa); a.cd.sk=J.skill.cd; return; }
    if(a.cd.atk<=0){ a.cd.atk=1.05; const crit=rnd()<.06; const mult=(a.fx.rage>G.t?1.6:1)*(a.fx.buff>G.t?1.25:1)*(a.fx.curse>G.t?.7:1);
      fxAt(J.rng>20?(J.magic?'bolt':'arrow'):'slash',tgt.u.x,f,J.magic?'#9fd0ff':'#ffffff',.25);
      if(tgt.k==='m') hitMon(tgt.u,st.atk,a,{mult,crit,magic:J.magic,ranged:J.rng>20}); else hitLord(st.atk,a,{mult,crit}); }
    return;
  }
  if(tgt&&td<60&&!charmed){ // dekati
    const mv=24*dt*(a.fx.slow>G.t?.5:1); if(a.fx.root>G.t) return; a.x+=Math.sign(tgt.u.x-a.x)*mv; a.walk+=dt; a.face=Math.sign(tgt.u.x-a.x); return; }
  if(pa&&pa.retreat) return;
  // jaga barisan: tunggu anggota yang tertinggal di lantai yang sama
  const mates=G.advs.filter(x=>x.party===a.party&&x.floor===f&&x!==a);
  const ahead=mates.length&&mates.some(x=>(a.x-x.x)*dir>26);
  const restingMate=mates.some(x=>x.resting||x.opening);
  if(ahead||restingMate){ a.walk=0; return; }
  if(a.fx.root>G.t) return;
  // maju
  const nx=a.x+dir*20*dt*(a.fx.slow>G.t?.5:1);
  // fasilitas di antara posisi lama dan baru
  for(let i=0;i<SLOTS;i++){ const sx=SLOT_X(i); if((a.x-sx)*(nx-sx)<=0&&(a.x!==sx)){ if(onFixture(a,p,pa,f,i)) return; } }
  a.x=nx; a.walk+=dt; a.face=dir;
  if(lordHere&&(a.x-G.lord.x)*dir>=-14){ a.x=G.lord.x-dir*14; return; }
  if((a.x-fend(f))*dir>=0){
    if(f<topF()){ a.floor=f+1; a.x=fstart(f+1); fxAt('stairs',a.x,a.floor,'#ffffff',.4); if(pa&&a===G.advs.find(x=>x.party===pa.id)) pa.deepest=Math.max(pa.deepest||0,a.floor); }
    else a.x=fend(f);

}
function useSkill(a,p,J,tgt,st,pa){
  const S=J.skill; const f=a.floor; say(a.x,f,S.n,'#9fe0ff',1.1);
  const atkTarget=(mult,opt)=>tgt.k==='m'?hitMon(tgt.u,st.atk,a,Object.assign({mult},opt||{})):hitLord(st.atk,a,Object.assign({mult},opt||{}));
  if(S.k==='guard'){ a.fx.guard=G.t+8; fxAt('shield',a.x,f,'#9fd0ff',.8); }
  else if(S.k==='aoe'){ fxAt('blast',tgt.u.x,f,'#ff8a3a',.7); for(const m of enemiesOn(f)) if(Math.abs(m.x-tgt.u.x)<36) hitMon(m,st.atk,a,{mult:S.m,magic:1}); if(tgt.k==='l') hitLord(st.atk,a,{mult:S.m}); }
  else if(S.k==='heal'){ const mates=G.advs.filter(x=>x.party===a.party&&x.floor===f); let low=null,lp=2; for(const x of mates){ const xs=advStats(G.people[x.pid]); const r=x.hp/xs.hp; if(r<lp){ lp=r; low=x; } } if(low){ const xs=advStats(G.people[low.pid]); low.hp=Math.min(xs.hp,low.hp+xs.hp*S.m+st.atk); fxAt('heal',low.x,f,'#9fff9a',.8); say(low.x,f,'+HP','#9fff9a',.9); } if(p.job==='paladin') a.fx.guard=G.t+4; }
  else if(S.k==='snipe') atkTarget(S.m,{crit:1,ranged:1});
  else if(S.k==='crit') atkTarget(S.m,{crit:1,sure:1});
  else if(S.k==='multi'){ for(let i=0;i<S.hits;i++) atkTarget(S.m); }
  else if(S.k==='pierce'){ atkTarget(S.m); const behind=enemiesOn(f).filter(m=>m!==tgt.u&&Math.abs(m.x-tgt.u.x)<26); if(behind[0]) hitMon(behind[0],st.atk,a,{mult:S.m*.7}); }
  else if(S.k==='rage'){ a.fx.rage=G.t+8; fxAt('rage',a.x,f,'#ff4040',.8); }
  else if(S.k==='buff'){ for(const x of G.advs) if(x.party===a.party) x.fx.buff=G.t+8; fxAt('note',a.x,f,'#ffe080',1); }
}
function onFixture(a,p,pa,f,i){
  const fx=G.fix[f][i]; if(!fx) return false;
  const key=f+':'+i; if(a.seen[key]) return false; a.seen[key]=1;
  const st=advStats(p); const sx=SLOT_X(i);
  if(fx.t==='chest'){ a.x=sx; a.opening=1.1; say(sx,f,'Peti!','#ffd36a',1); return true; }
  if(fx.t==='mimik'){ const scout=partyMembers(pa||{members:[]}).find(pp=>JOBS[pp.job].scout); if(scout&&rnd()<.2+scout.lv*.003){ say(sx,f,'Itu mimik!','#9fe0ff',1.3); return false; } a.x=sx; a.opening=1.1; say(sx,f,'Peti!','#ffd36a',1); return true; }
  if(fx.t==='rest'){
    const mates=G.advs.filter(x=>x.party===a.party);
    const hurt=mates.some(x=>x.hp<advStats(G.people[x.pid]).hp*.7);
    if(pa&&(hurt||f>pa.saveFloor)){ const fee=8+f*4; let paid=0; for(const x of mates){ const pp=G.people[x.pid]; const c=Math.min(pp.gold,fee); pp.gold-=c; paid+=c; x.resting=3.5; x.x=sx-fdir(f)*mates.indexOf(x)*7; x.floor=f; }
      G.gold+=paid; G.mana+=paid*.3; pa.saveFloor=Math.max(pa.saveFloor,f); G.pop+=.6; fx.uses=(fx.uses||0)+1; fx.earn=(fx.earn||0)+paid; fx.last=pa.name;
      say(sx,f,`Istirahat (+${paid}G)`,'#ffd36a',1.6); fxAt('fire',sx,f,'#ffa040',3.5); return true; }
    return false;
  }
  if(fx.t==='rahasia'){
    if(fx.found) return false; const gs=secretMons(fx).filter(x=>!x.dead); if(!gs.length) return false; const m=gs[0];
    const scouts=partyMembers(pa||{members:[]}).filter(pp=>JOBS[pp.job].scout);
    if(scouts.length&&rnd()<.3+scouts[0].lv*.004){ fx.found=a.party; fx.foundAt=G.t; gs.forEach((g,k)=>{ g.x=sx+(k-1)*8; }); say(sx,f,'Jalan rahasia!','#c08aff',2); log(`${scouts[0].name} (${JOBS[scouts[0].job].n}) dari ${pa.name} menemukan dinding retak di lantai ${f+1}! ${gs.map(g=>g.name).join(', ')} keluar dari ruang rahasia.`,'warn'); fxAt('crack',sx,f,'#c08aff',1.2); return true; }
    return false;
  }
  if(FIX[fx.t]&&FIX[fx.t].cat==='jebakan'){
    if(pa&&pa.disarm[key]) return false;
    const scout=partyMembers(pa||{members:[]}).find(pp=>JOBS[pp.job].scout);
    if(scout&&rnd()<.25+scout.lv*.004){ if(pa) pa.disarm[key]=1; say(sx,f,'Jebakan ketahuan!','#9fe0ff',1.3); return false; }
    triggerTrap(fx,a,p,st,f,sx,pa); return false;
  }
  return false;
}
function triggerTrap(fx,a,p,st,f,sx,pa){
  const D=FIX[fx.t]; const lv=fx.lv||1; const mult=1+(lv-1)*.25;
  const near=G.advs.filter(x=>x.floor===f&&Math.abs(x.x-sx)<22);
  fxAt('trap_'+fx.t,sx,f,'#ffffff',.9);
  fx.hits=(fx.hits||0)+1;
  if(D.sleep){ for(const x of near) x.fx.sleep=G.t+D.sleep; say(sx,f,'Zzz…','#d0c0ff',1.4); return; }
  if(D.root){ a.fx.root=G.t+D.root; say(sx,f,'Terjerat!','#c8c0a0',1.2); return; }
  if(D.slip||D.fall){ if(f>0){ const victims=D.fall?[a]:near; for(const x of victims){ x.floor=f-1; x.x=fend(f-1)-fdir(f-1)*ri(4,20); x.seen={}; if(D.dmg){ const raw=Math.round(advStats(G.people[x.pid]).hp*D.dmg*mult); x.hp-=raw; say(x.x,x.floor,String(raw),'#ff8a7a',.9); if(x.hp<=0) advDie(x,null); } } say(sx,f,D.fall?'Jatuh!':'Terpeleset!','#ffd0a0',1.3); return; } }
  if(D.dmg){ const victims=fx.t==='apiT'?near:[a]; for(const x of victims){ const xs=advStats(G.people[x.pid]); const raw=xs.hp*D.dmg*mult+lv*4; x.hp-=Math.round(raw*(x.fx.sleep>G.t?2:1)); if(x.fx.sleep>G.t){ x.fx.sleep=0; say(x.x,f,'KOMBO!','#ff9ad0',1.2); } say(x.x,f,String(Math.round(raw)),'#ff8a7a',.9); if(D.stun) x.fx.stun=G.t+D.stun; if(D.burn) x.fx.burn=G.t+4; if(x.hp<=0) advDie(x,null); } }
}
function openChest(a,pa){
  const f=a.floor; const i=G.fix[f].findIndex((x,j)=>x&&(x.t==='chest'||x.t==='mimik')&&Math.abs(SLOT_X(j)-a.x)<4); if(i<0) return;
  const fx=G.fix[f][i];
  if(fx.t==='mimik'){ const p=G.people[a.pid]; const st=advStats(p); const lv=fx.lv||1; const dmg=Math.round(st.hp*(.28+lv*.04)); const steal=Math.round(p.gold*.25); p.gold-=steal; G.gold+=steal; fx.hits=(fx.hits||0)+1;
    fxAt('claw',a.x,f,'#ff6060',.5); say(a.x,f,'MIMIK!','#ff6060',1.4); say(a.x+6,f,String(dmg),'#ff8a7a',1); if(steal) say(a.x,f,`+${steal}G`,'#ffd36a',1.4); a.fx.stun=G.t+1; a.hp-=dmg; if(a.hp<=0) advDie(a,null); return; } const v=chestValue(fx.r); const gold=Math.round(chestCost(fx.r)*rand(.6,1.1));
  G.fix[f][i]=null; G.stats.chests++;
  const mem=pa?partyMembers(pa):[G.people[a.pid]];
  for(const p of mem){ p.eq.atk+=1+v*1.4; p.eq.def+=.6+v*.9; p.eq.hp+=4+v*6; p.gold+=Math.round(gold/mem.length); }
  if(pa){ pa.loot+=gold; pa.greed=(pa.greed||0)+1+v; }
  G.pop+=1.5+v*1.8; fxAt('chest',SLOT_X(i),f,'#ffd36a',1);
  say(SLOT_X(i),f,`Peti ${fx.r}!`,'#ffd36a',1.6);
  if(v>=4||rnd()<.25) log(`${pa?pa.name:G.people[a.pid].name} membuka Peti ${fx.r} di lantai ${f+1} dan mendapat perlengkapan bagus. Mereka makin bersemangat naik!`,'adv');
  if(G.settings.autoChest&&G.gold>=chestCost(fx.r)) orderPlace(f,i,{t:'chest',r:fx.r});
}
function partyTick(pa){
  const mem=G.advs.filter(a=>a.party===pa.id); if(!mem.length){ if(pa.state==='in') pa.state=partyMembers(pa).length?'town':'gone'; return; }
  if(pa.retreat){ if(G.t>=pa.retreat) leaveDungeon(pa,'kabur'); return; }
  let hp=0,mx=0; for(const a of mem){ const s=advStats(G.people[a.pid]); hp+=Math.max(0,a.hp); mx+=s.hp; }
  const healer=mem.some(a=>['priest','paladin'].includes(G.people[a.pid].job));
  const lost=pa.members.length<(pa.size0||(pa.size0=pa.members.length));
  const ratio=hp/mx;
  if(ratio<(healer?.22:.35)||lost&&ratio<.5&&rnd()<.02||G.t-pa.entered>240){ pa.retreat=G.t+1; for(const a of mem) say(a.x,a.floor,'Mundur!','#9fe0ff',1); return; }
  // puas: sudah dapat banyak harta dan lelah
  if(pa.loot>0&&ratio<.5&&(pa.greed||0)<3&&rnd()<.01){ leaveDungeon(pa,'puas'); }
}

/* ---------- AI monster ---------- */
function monTick(m,dt){
  if(m.dead){ if(G.t>=m.reviveAt){ const c=reviveCost(m); if(G.mana>=c){ G.mana-=c; m.dead=false; m.hp=monStats(m).hp; m.x=m.px; m.fx={}; fxAt('rise',m.x,m.floor,'#c08aff',.8); } } return; }
  if(m.floor<0) return;
  const st=monStats(m);
  for(const k in m.cd) m.cd[k]-=dt;
  if(m.abil.includes('regen')&&m.hp<st.hp) m.hp=Math.min(st.hp,m.hp+st.hp*.02*dt);
  if(m.secret){ const fx=G.fix[m.secret.f]&&G.fix[m.secret.f][m.secret.slot]; if(!fx){ m.secret=null; } else if(!fx.found){ const i=secretMons(fx).indexOf(m); m.x=SLOT_X(m.secret.slot)+(i-1)*7; m.px=m.x; return; } else if(G.t-(fx.foundAt||0)>30&&!G.advs.some(a=>a.floor===m.floor)&&secretMons(fx).every(g=>!g.dead)){ fx.found=false; return; } }
  if(m.fx.stun>G.t) return;
  if(m.hiding){ if(G.t>m.hiding){ m.hiding=0; m.hidden=false; } else { m.hp=Math.min(st.hp,m.hp+st.hp*.05*dt); return; } }
  if(m.flee&&m.hp<st.hp*.25&&!m.hiding){ m.hiding=G.t+8; m.hidden=true; say(m.x,m.floor,'Kabur!','#c0c0c0',1); return; }
  const f=m.floor; const foes=G.advs.filter(a=>a.floor===f&&!a.resting);
  if(m.strat==='sergap'&&!m.revealed){ m.hidden=true; const near=foes.find(a=>Math.abs(a.x-m.x)<12); if(near){ m.hidden=false; m.revealed=G.t; hitAdv(near,st.atk,{kind:'m',u:m},{mult:2,sure:1}); say(m.x,f,'Sergap!','#ff6060',1.2); } return; }
  if(m.strat==='sergap'&&m.revealed&&!foes.some(a=>Math.abs(a.x-m.x)<60)&&G.t-m.revealed>5){ m.revealed=0; }
  let range=m.strat==='agresif'?FW:m.strat==='dukung'?50:44;
  let tgt=null,td=1e9; for(const a of foes){ const anchor=m.strat==='agresif'?m.x:m.px; const da=Math.abs(a.x-anchor); if(da>range) continue; const d=Math.abs(a.x-m.x); if(d<td){ td=d; tgt=a; } }
  // ability aktif
  if(tgt||m.strat==='dukung') for(const ab of m.abil){ const A=ABIL[ab]; if(A.k!=='a'||(m.cd[ab]||0)>0) continue; if(useMonAbil(m,ab,tgt,st,foes)){ m.cd[ab]=A.cd*rand(.9,1.2); return; } }
  if(tgt){
    if(td<=st.rng){ m.face=Math.sign(tgt.x-m.x)||1; if((m.cd.atk||0)<=0){ m.cd.atk=1.15/st.spd; const crit=rnd()<.05+(m.abil.includes('elang')?.2:0); const p=G.people[tgt.pid];
        let mult=(m.fx.teriak>G.t?1.3:1)*(m.abil.includes('semangat')&&G.mons.filter(o=>!o.dead&&o.floor===f).length>=3?1.2:1)*(m.abil.includes('amarah')&&m.hp<st.hp*.4?1.5:1)*(m.fx.curse>G.t?.7:1)*(m.abil.includes('pemburu')&&p&&p.lv<m.lv?1.4:1);
        if(tgt.fx.guard>G.t){ const kn=G.advs.find(x=>x.party===tgt.party&&x.fx.guard>G.t&&x.floor===f); if(kn) tgt=kn; }
        fxAt(st.rng>20?'bolt':'claw',tgt.x,f,'#ff9a9a',.25); hitAdv(tgt,st.atk,{kind:'m',u:m},{mult,crit});
        if(m.abil.includes('auraRacun')&&rnd()<.4) tgt.fx.poison=G.t+5; } }
    else { const sp=18*st.spd*dt*(m.fx.slow>G.t?.5:1); m.x+=Math.sign(tgt.x-m.x)*sp; m.face=Math.sign(tgt.x-m.x); m.walk=(m.walk||0)+dt; }
    return;
  }
  // tanpa target: kembali ke pos / patroli
  let goal=m.px; if(m.strat==='agresif'){ if(!m.patrol||Math.abs(m.x-m.patrol)<3) m.patrol=rand(20,FW-20); goal=m.patrol; }
  if(m.strat==='dukung'){ const ally=G.mons.find(o=>o!==m&&!o.dead&&o.floor===f&&!o.secret); if(ally) goal=ally.x-fdir(f)*16; }
  const d=goal-m.x; if(Math.abs(d)>2){ m.x+=Math.sign(d)*Math.min(Math.abs(d),12*st.spd*dt); m.face=Math.sign(d); m.walk=(m.walk||0)+dt; } else m.walk=0;
}
function useMonAbil(m,ab,tgt,st,foes){

  const inR=r=>foes.filter(a=>Math.abs(a.x-m.x)<r);

  if(!tgt) return false;

  else if(ab==='beku'){ fxAt('ice',tgt.x,f,'#9fe8ff',.8); for(const a of T){ hitAdv(a,st.atk,src,{mult:1.3}); if(a.hp>0) a.fx.slow=G.t+5; } }
  else if(ab==='petir'){ fxAt('zap',tgt.x,f,'#ffe040',.6); hitAdv(tgt,st.atk,src,{mult:2.4,sure:1}); }
  else if(ab==='raung'){ fxAt('roar',m.x,f,'#ffffff',.8); for(const a of inR(36)) a.fx.stun=G.t+2; }
  else if(ab==='jaring'){ tgt.fx.root=G.t+3; tgt.fx.slow=G.t+5; fxAt('web',tgt.x,f,'#e8e8e8',1); }

  else if(ab==='ledak'){ fxAt('boom',m.x,f,'#ff7a3a',1); for(const a of T) hitAdv(a,st.atk,src,{mult:2.2}); m.hp-=st.hp*.25; if(m.hp<=0) monDie(m,null); }
  else if(ab==='kedip'){ const back=foes.filter(a=>['priest','mage','bard','archer'].includes(G.people[a.pid].job)); const t2=back[0]||tgt; m.x=t2.x-fdir(f)*-8; fxAt('warp',m.x,f,'#c08aff',.5); hitAdv(t2,st.atk,src,{mult:1.5}); }
  else if(ab==='serapMana'){ const d=hitAdv(tgt,st.atk,src,{mult:1.2}); G.mana+=d*.5+3; fxAt('soul',tgt.x,f,'#7fd8ff',.6); }
  else if(ab==='kutuk'){ tgt.fx.curse=G.t+8; fxAt('curse',tgt.x,f,'#a85ad0',1); }
  else if(ab==='tebas'){ hitAdv(tgt,st.atk,src,{mult:1.8}); }
  else if(ab==='goda'){ tgt.fx.charm=G.t+4; fxAt('heart',tgt.x,f,'#ff7ab0',1); }
  else if(ab==='gempa'){ fxAt('roar',m.x,f,'#c8a070',1); for(const a of foes) a.fx.stun=G.t+1.5; }
  else if(ab==='tornado'){ fxAt('blast',tgt.x,f,'#bff0d0',.8); for(const a of T){ hitAdv(a,st.atk,src,{mult:1.3}); if(a.hp>0) a.x-=fdir(f)*14; } }
  else if(ab==='meteor'){ const M_=inR(55); fxAt('boom',tgt.x,f,'#ff7a3a',1.2); for(const a of M_) hitAdv(a,st.atk,src,{mult:2.6}); }
  else if(ab==='teriak'){ for(const o of G.mons) if(!o.dead&&o.floor===f) o.fx.teriak=G.t+8; fxAt('roar',m.x,f,'#ff6a3a',.8); }
  else if(ab==='perisai'){ for(const o of G.mons) if(!o.dead&&o.floor===f){ o.fx.perisai=G.t+6; fxAt('shield',o.x,f,'#9fd0ff',.8); } }
  else if(ab==='tidur'){ tgt.fx.sleep=G.t+3; fxAt('note',tgt.x,f,'#d0c0ff',1); }
  else if(ab==='serbu'){ m.x=tgt.x-fdir(f)*-10*Math.sign(m.x-tgt.x||1); fxAt('slash',tgt.x,f,'#ffffff',.4); hitAdv(tgt,st.atk,src,{mult:2}); }
  else if(ab==='bayang'){ const k=addMonster(m.sp); k.temp=G.t+10; k.floor=f; k.px=m.x+ri(-10,10); k.x=k.px; k.lv=m.lv; k.hp=monStats(k).hp*.6; k.name='Bayangan '+m.name; k.abil=[m.abil[0]]; fxAt('warp',k.x,f,'#6a4aaa',.6); }

  return true;
}

function lordTick(dt){
  const L=G.lord; if(L.hp<=0) return; const st=lordStats(); const f=topF();
  for(const k in L.cd) L.cd[k]-=dt;
  if(L.hp<st.hp&&!G.advs.some(a=>a.floor===f)) L.hp=Math.min(st.hp,L.hp+st.hp*.05*dt);
  const foes=G.advs.filter(a=>a.floor===f&&Math.abs(a.x-L.x)<st.rng+4);
  if(!foes.length) return;
  const src={kind:'l'};
  if((L.cd.sp||0)<=0){ L.cd.sp=9; const r=L.race;
    if(r==='naga'){ say(L.x,f,'Napas Naga!','#ff8a3a',1.3); fxAt('fire',L.x-fdir(f)*20,f,'#ff6a2a',1); for(const a of G.advs.filter(a=>a.floor===f&&Math.abs(a.x-L.x)<70)) hitAdv(a,st.atk,src,{mult:1.4}); }
    else if(r==='succubus'){ const a=pick(foes); a.fx.charm=G.t+5; say(L.x,f,'Pikatan!','#ff7ab0',1.2); fxAt('heart',a.x,f,'#ff7ab0',1); }
    else { say(L.x,f,'Gelombang Kegelapan','#c060ff',1.3); fxAt('blast',L.x,f,'#8a3aff',.8); for(const a of foes) hitAdv(a,st.atk,src,{mult:1.2}); }
    return; }
  if((L.cd.atk||0)<=0){ L.cd.atk=1.1; const t=foes.sort((a,b)=>Math.abs(a.x-L.x)-Math.abs(b.x-L.x))[0]; fxAt('claw',t.x,f,'#ff6080',.3); hitAdv(t,st.atk,src,{crit:rnd()<.08}); }
}

/* ---------- tik utama ---------- */
function step(){
  const dt=DT; G.t+=dt;
  const day=1+Math.floor(G.t/DAY_LEN); if(day!==G.day){ G.day=day; dailyTick(); }
  G.mana+=dt*(1+G.advs.length*.15+G.floors*.06)*(G.lord.race==='elfGelap'?1.5:1);
  G.pop+=dt*.004*G.floors; G.gold+=dt*(.6+G.floors*.15);
  for(const a of G.advs) if(a.floor>(G.stats.deep||0)) G.stats.deep=a.floor;
  for(let i=TIMERS.length-1;i>=0;i--) if(G.t>=TIMERS[i].at){ const t=TIMERS[i]; TIMERS.splice(i,1); t.fn(); }
  spawnTick(dt); if(Math.floor(G.t)!==Math.floor(G.t-dt)) heroTick();
  for(const a of G.advs.slice()) advTick(a,dt);
  for(const pa of G.parties) if(pa.state==='in') partyTick(pa);
  for(const m of G.mons) monTick(m,dt);
  for(const m of G.mons) if(m.temp&&(G.t>m.temp||m.dead)){ m.dead=true; m.gone=1; }
  if(G.mons.some(m=>m.gone)) G.mons=G.mons.filter(m=>!m.gone);
  if(G.lord) lordTick(dt);
  assistTick(dt);
  for(let i=EFX.length-1;i>=0;i--){ EFX[i].t-=dt; if(EFX[i].t<=0) EFX.splice(i,1); }
}
function dailyTick(){
  // kesetiaan pelan-pelan naik dengan aura
  for(const m of G.mons) m.loy=clamp(m.loy+(G.aura>=10?1:0)-(m.loy>70&&G.aura<5?1:0),0,100);
  if(G.day%5===0) log(`Hari ${G.day}. Popularitas ${Math.round(G.pop)} · ${G.floors} lantai · Raja Iblis ${G.lord.name} Lv${G.lord.lv} bertahan ${Math.round((G.t-G.lordSince)/DAY_LEN*10)/10} hari.`,'sys');
}

function outline(g){

  const a=(x,y)=>x<0||y<0||x>=SW||y>=SH?0:d[(y*SW+x)*4+3]>40;
  const mark=[];
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){ if(a(x,y)) continue; if(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)) mark.push((y*SW+x)*4); }
  for(const i of mark){ d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=255; }
  g.putImageData(img,0,0);
}
function sprite(p,dir,f,raw){

function monSprite(m,f){
  const key='m|'+JSON.stringify(m)+f; let c=cache.get(key); if(c) return c;
  c=newCanvas(); const g=c.getContext('2d'); const P=mkP(g);
  if(m.k==='slime') drawSlime(P,m.c,f,m.king);
  else if(m.k==='wolf') drawQuad(P,m.c,f,false,m.eye||'#ffd040','wolf');
  else if(m.k==='bat') drawBat(P,m.c,f);
  else if(m.k==='spider') drawSpider(P,m.c,f);
  else if(m.k==='mimic') drawMimic(P,m.c,f);
  else if(m.k==='wyvern') drawWyvern(P,m.c,f,m.eye||'#ffd040');
  else if(m.k==='boar') drawBoar(P,m.c,f);
  else if(m.k==='ghost') drawGhost(P,m.c,f);
  else if(m.k==='bear') drawBear(P,m.c,f);
  else if(m.k==='imp') drawImp(P,m.c,f);
  else if(m.k==='hound'){ drawQuad(P,m.c,f,true,m.eye||'#ff8a3a','wolf'); const fl=f%2; P(-11,-13-fl,2,2,'#ff8a3a'); P(-12,-15-fl,1,2,'#ffd040'); P(5,-15,1,2,'#ff6a2a'); P(7,-16+fl,1,2,'#ffb040'); P(-3,-11,1,1,'#ff6a2a'); P(1,-11,1,1,'#ff6a2a'); }
  else if(m.k==='hum'){ const p={race:m.race,stage:'dewasa',job:m.job,sex:'m',skin:SPR(m.race).skin[0],hair:SPR(m.race).hair[0],eye:SPR(m.race).eye[0],cloth:'#7a5a36',style:'short'}; g.drawImage(sprite(p,m.dir||'down',f,true),0,0); }
  else drawExtraMon(P,m,f);
  outline(g); cache.set(key,c); return c;
}

function drawJurangMon3(P,m,f){
  if(m.k==='dragon2'){ drawDragon2(P,m,f,false); return; }
  if(m.k==='dragonE2'){ drawDragon2(P,m,f,true); return; }
  if(m.k==='golemX'){ drawGolem2(P,m,f); return; }
  if(m.k==='beastman'){ drawBeastman(P,m,f); return; }
  return false;
}

function blit(g,spr,x,y,flip,sc,alpha){
  sc=sc||1; const w=spr.width*sc, h=spr.height*sc;
  if(alpha!=null) g.globalAlpha=alpha;

  else g.drawImage(spr,Math.round(x)-16*sc,Math.round(y)-33*sc,w,h);

/* latar dinding per tema, digambar sekali */
function wallBg(ti){
  let c=RC.bg.get(ti); if(c) return c; const T=THEMES[ti];
  c=document.createElement('canvas'); c.width=FW; c.height=FH; const g=c.getContext('2d');
  g.fillStyle=T.wall; g.fillRect(0,0,FW,FH);
  let seed=ti*97+3; const r=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let y=4;y<FH-8;y+=7){ const off=(y/7)%2?0:9; for(let x=-off;x<FW;x+=18){ g.fillStyle=r()<.5?T.wall2:shade(T.wall,.06); g.fillRect(x+1,y+1,16,5); } }
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,0,FW,4);
  g.fillStyle=T.floor; g.fillRect(0,FH-8,FW,8); g.fillStyle=shade(T.floor,.18); g.fillRect(0,FH-8,FW,1); g.fillStyle=shade(T.floor,-.25); g.fillRect(0,FH-2,FW,2);
  for(let x=4;x<FW;x+=12){ g.fillStyle=shade(T.floor,-.12); g.fillRect(x,FH-5,6,1); }
  if(ti===2){ for(let i=0;i<9;i++){ const x=r()*FW; g.fillStyle=T.acc; g.fillRect(x,FH-11,2,3); g.fillStyle='#e86a8a'; g.fillRect(x-1,FH-13,4,2); } }
  if(ti===3){ for(let i=0;i<7;i++){ const x=r()*FW, y=6+r()*28; g.fillStyle=T.acc; g.fillRect(x,y,2,5); g.fillRect(x-1,y+2,4,1); } }
  if(ti===4){ for(let i=0;i<6;i++){ const x=r()*FW; g.fillStyle='#ff7a3a'; g.fillRect(x,FH-8,8,1); } }
  if(ti===5){ for(let x=6;x<FW;x+=22){ g.fillStyle='#d8f4ff'; g.fillRect(x,4,1,4); g.fillRect(x+1,4,1,2); } }
  return c;
}

/* ---------- gambar utama ---------- */
function render(){
  const cv=RC.cv, g=RC.g; if(!cv||!G) return;
  const s=RC.s; const vh=(RC.h-(RC.padB||0))/s;
  RC.camY=clamp(RC.camY,Math.min(0,worldH()-vh),Math.max(0,worldH()-vh));
  g.setTransform(1,0,0,1,0,0); g.imageSmoothingEnabled=false;
  g.fillStyle='#0b0812'; g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(s,0,0,s,0,Math.round(-RC.camY*s));
  const y0=RC.camY, y1=RC.camY+vh;
  // langit & atap
  if(y0<ROOF){ if(y0<0){ g.fillStyle='#120a1e'; g.fillRect(0,y0,FW,-y0); for(let i=0;i<40;i++){ const sx=(i*53)%FW, sy=y0+((i*97)%Math.max(1,-y0)); g.fillStyle=i%3?'#4a3a6a':'#c8b8e8'; g.fillRect(sx,sy,1,1); } } const gr=g.createLinearGradient(0,0,0,ROOF); gr.addColorStop(0,'#120a1e'); gr.addColorStop(1,'#3a1a3a'); g.fillStyle=gr; g.fillRect(0,0,FW,ROOF);
    g.fillStyle='#e8d8f0'; g.fillRect(160,8,6,6); g.fillStyle='#1a0e2a'; g.fillRect(162,7,5,5);
    g.fillStyle='#24182a'; g.fillRect(10,ROOF-14,FW-20,14); for(let x=10;x<FW-10;x+=12){ g.fillRect(x,ROOF-19,7,5); }
    g.fillStyle='#24182a'; g.fillRect(14,ROOF-34,14,20); g.fillRect(FW-28,ROOF-34,14,20); g.fillStyle='#3a1a3a'; g.fillRect(12,ROOF-38,18,4); g.fillRect(FW-30,ROOF-38,18,4);
    g.fillStyle='#ff6a3a'; g.fillRect(20,ROOF-28,2,3); g.fillRect(FW-22,ROOF-28,2,3);
    g.fillStyle='#e3b75e'; g.font='bold 7px "Pixelify Sans",monospace'; g.textAlign='center'; g.fillText('TAKHTA JURANG',FW/2,ROOF-5); }
  for(let f=0;f<G.floors;f++){
    const top=floorTop(f); if(top>y1||top+FH<y0) continue;
    const ti=Math.floor(f/10)%THEMES.length; g.drawImage(wallBg(ti),0,top);
    const base=floorBase(f);
    // label lantai
    g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(1,top+2,17,8); g.fillStyle=THEMES[ti].acc; g.font='6px "Pixelify Sans",monospace'; g.textAlign='left'; g.fillText('L'+(f+1),3,top+8);
    // tangga / pintu / singgasana
    if(f===0){ g.fillStyle='#120c16'; g.fillRect(0,base-24,8,24); g.fillStyle='#6a5a4a'; g.fillRect(7,base-25,2,25); }
    if(f<topF()) drawStairs(g,fend(f),base,fdir(f)); else drawThrone(g,G.lord.x,base,-fdir(f));
    // petak & fasilitas
    for(let i=0;i<SLOTS;i++){ const x=SLOT_X(i); const fx=G.fix[f][i];
      if(UI.placing&&!fx){ g.fillStyle=Math.floor(G.t*3)%2?'rgba(255,154,208,.55)':'rgba(255,154,208,.3)'; g.fillRect(x-6,base,12,2); }
      if(fx) drawFix(g,fx,x,base,f);
      if(fx&&fx.lv>1){ g.fillStyle='#9fe0ff'; g.fillRect(x+5,base+2,1,1); g.fillRect(x+6,base+1,1,1); }
      const q=G.assist.q.find(q=>q.f===f&&q.slot===i); if(q){ g.globalAlpha=.4; drawFix(g,q.fx,x,base,f); g.globalAlpha=1; }
      if(UI.sel&&UI.sel.k==='fix'&&UI.sel.f===f&&UI.sel.i===i){ g.strokeStyle='#ffd36a'; g.lineWidth=.6; g.strokeRect(x-8,base-14,16,16); }
    }
  }
  // unit
  const items=[];
  for(const m of G.mons){ if(m.floor<0) continue; items.push({k:'m',u:m,f:m.floor,x:m.x,sec:m.secret&&!secretFound(m)}); }
  for(const a of G.advs) items.push({k:'a',u:a,f:a.floor,x:a.x});
  if(G.lord&&G.lord.hp>0) items.push({k:'l',u:G.lord,f:topF(),x:G.lord.x});
  for(const it of items){ const base=floorBase(it.f); if(base<y0-10||base-40>y1) continue; const u=it.u;
    if(it.k==='m'){ const m=u;
      if(m.dead){ g.fillStyle='#5a5060'; g.fillRect(m.px-3,base-7,6,7); g.fillRect(m.px-4,base-5,8,2); g.fillStyle='#8a7a9a'; g.fillRect(m.px-1,base-6,2,1);
        const left=Math.max(0,m.reviveAt-G.t); g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(m.px-6,base-11,12,2); g.fillStyle=G.mana>=reviveCost(m)?'#b07aff':'#6a5a7a'; g.fillRect(m.px-6,base-11,12*(1-left/60),2); continue; }
      const S=SPECIES[m.sp], M=MON[S.mk]; const fr=frameOf(m.walk||0,(m.walk||0)>0); const spr=monSpr(m.sp,fr);
      const sc=Math.min(1.3,M.sc||1)*(M.k==='hum'?1:1);
      blit(g,spr,m.x,base+(M.k==='bat'||M.k==='wyvern'?-4:0),(m.face||1)<0,it.sec?Math.min(sc,1)*.8:sc,it.sec?.6:m.hidden?.35:null);
      if(S.stage>=3){ const n=S.stage>=4?5:3; for(let i=0;i<n;i++){ const a=G.t*2+i*2.1; g.fillStyle=S.stage>=4?(i%2?'#e0a0ff':'#fff'):'#ffd860'; g.fillRect(Math.round(m.x+Math.cos(a)*9),Math.round(base-16+Math.sin(a)*6),1,1); } }
      hpBar(g,m.x,base-24*sc-3,m.hp/monStats(m).hp,'#b07aff',m.lastHit&&G.t-m.lastHit<4);
      if(UI.sel&&UI.sel.k==='m'&&UI.sel.id===m.id){ g.fillStyle='#ffd36a'; g.fillRect(m.x-1,base-30*sc-6,3,2); g.fillRect(m.x,base-30*sc-4,1,1); }
    } else if(it.k==='a'){ const a=u; const p=G.people[a.pid]; if(!p) continue;
      const mv=(a.walk||0)>0; const spr=advSpr(p,frameOf(a.walk||0,mv)); blit(g,spr,a.x,base,(a.face||fdir(a.floor))<0,1,a.fx.charm>G.t?.7:null);
      if(a.fx.sleep>G.t){ g.fillStyle='#d0c0ff'; g.font='5px monospace'; g.fillText('z',a.x+4,base-30-(G.t*4%4)); }
      if(a.fx.stun>G.t){ g.fillStyle='#ffd040'; g.fillRect(a.x-3+Math.round(Math.sin(G.t*8)*3),base-33,2,2); }
      if(a.resting){ g.fillStyle='#9fff9a'; g.fillRect(a.x,base-33-(G.t*6%6),1,2); }
      const pa=G.parties.find(x=>x.id===a.party); if(pa&&pa.hero){ g.fillStyle='#ffd36a'; g.fillRect(a.x-1,base-36,3,1); }
      hpBar(g,a.x,base-30,a.hp/advStats(p).hp,'#e0645a',true);
    } else { const L=u; const r=lordRace(); const spr=lordSpr(Math.floor(G.t*2)%2); blit(g,spr,L.x,base,fdir(it.f)>0,r.sc?Math.min(1.35,r.sc):1.15);
      hpBar(g,L.x,base-42,L.hp/lordStats().hp,'#ff4a6a',true,22); }
  }
  // asisten
  { const A=G.assist; const base=floorBase(A.f); const bob=Math.round(Math.sin(G.t*3)*1.5); blit(g,assistSpr(Math.floor(G.t*4)%4),A.x,base-3+bob,(A.dir||1)<0,1); if(A.busy){ g.fillStyle='#ff9ad0'; g.fillRect(A.x+6,base-26+bob,2,2); } }
  // efek
  for(const e of EFX){ if(e.k==='txt') continue; const base=floorBase(e.f); const p=1-e.t/e.t0; drawEfx(g,e,base,p); }
  // dasar tanah
  { const by=ROOF+G.floors*FH; if(by<y1){ g.fillStyle='#1a1018'; g.fillRect(0,by,FW,BASE); g.fillStyle='#2a1a22'; for(let x=0;x<FW;x+=9) g.fillRect(x,by+3+(x%4),5,2); } }
  // teks melayang (di ruang layar agar tajam)
  g.setTransform(1,0,0,1,0,0); g.textAlign='center';
  for(const e of EFX){ if(e.k!=='txt') continue; const p=1-e.t/e.t0; const wy=floorBase(e.f)-34-p*10; const sx=e.x*s, sy=(wy-RC.camY)*s; if(sy<-20||sy>cv.height+20) continue;
    const quote=e.s.length>14; const fs=Math.round((quote?6:6.5)*s);
    g.font=`${quote?'500':'700'} ${fs}px "Signika","Alegreya Sans",sans-serif`;
    g.globalAlpha=Math.min(1,e.t*3);
    if(quote){ const w=Math.min(cv.width-8,g.measureText(e.s).width+10*s/2); const bx=clamp(sx,w/2+4,cv.width-w/2-4); g.fillStyle='rgba(20,14,26,.88)'; g.fillRect(bx-w/2,sy-fs-2,w,fs+6); g.fillStyle=e.c; g.fillText(e.s,bx,sy); }
    else { g.lineWidth=Math.max(2,s*.9); g.strokeStyle='rgba(10,6,14,.9)'; g.strokeText(e.s,sx,sy); g.fillStyle=e.c; g.fillText(e.s,sx,sy); }

function pickAtCanvas(cx,cy){
  const s=RC.s; const wx=cx/s, wy=cy/s+RC.camY;
  let f=-1; for(let i=0;i<G.floors;i++){ const t=floorTop(i); if(wy>=t&&wy<t+FH){ f=i; break; } }
  if(f<0) return null;
  const base=floorBase(f);
  if(!UI.placing){ let best=null,bd=10;
    for(const a of G.advs) if(a.floor===f){ const d=Math.abs(a.x-wx); if(d<bd&&wy>base-34&&wy<base+4){ bd=d; best={k:'a',id:a.pid}; } }
    for(const m of G.mons) if(m.floor===f){ const x=m.dead?m.px:m.x; const d=Math.abs(x-wx); if(d<bd&&wy>base-34&&wy<base+4){ bd=d; best={k:'m',id:m.id}; } }
    if(f===topF()&&Math.abs(G.lord.x-wx)<12&&wy>base-40) best={k:'l'};
    if(best) return best; }
  let si=-1,sd=9; for(let i=0;i<SLOTS;i++){ const d=Math.abs(SLOT_X(i)-wx); if(d<sd){ sd=d; si=i; } }
  if(si>=0) return {k:'slot',f,i:si};
  return {k:'floor',f};
}

  resize(); window.addEventListener('resize',resize); new ResizeObserver(resize).observe(cv);
  let down=null;
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); down={y:e.clientY,x:e.clientX,cam:RC.camY,moved:false}; });
  cv.addEventListener('pointermove',e=>{ if(!down) return; const dy=e.clientY-down.y; if(Math.abs(dy)>6) down.moved=true; if(down.moved){ const dpr=cv.width/cv.getBoundingClientRect().width; RC.camY=down.cam-dy*dpr/RC.s; RC.follow=false; } });

/* ---------- aksi ---------- */
function act(a,el){
  let err=null;
  const m=UI.monId&&G.mons.find(x=>x.id===UI.monId);
  if(a==='floor'){ err=buyFloor(); if(!err){ toast(`Lantai ${G.floors} dibangun!`); scrollToFloor(topF()); } }
  else if(a==='rename'&&m){ const v=$('nmIn').value; const r=askRename(m,v); if(r.msg) toast(r.msg); else { UI.rnReply={id:m.id,ok:r.ok,reply:r.reply,alt:r.alt}; UI.nmDraft=r.ok?null:{id:m.id,v}; if(m.floor>=0) say(m.x,m.floor,r.ok?'♪':'Hmph!',r.ok?'#9fff9a':'#ff9aa8',1.2); if(r.ok) log(`${r.old} setuju dipanggil ${m.name} mulai sekarang.`,'evo'); } }
  else if(a==='takeAlt'&&m&&UI.rnReply&&UI.rnReply.alt){ const old=m.name; acceptAlt(m,UI.rnReply.alt); UI.rnReply={id:m.id,ok:true,reply:'Hihi, nama pilihanku memang paling keren!'}; UI.nmDraft=null; log(`${old} kini bernama ${m.name}, nama pilihannya sendiri.`,'evo'); }
  else if(a==='gift'&&m){ if(G.gold<40) err='Emas kurang.'; else { G.gold-=40; m.loy=Math.min(100,m.loy+12); monGainExp(m,monNeed(m)*.1); toast(`${m.name} senang sekali!`); if(m.floor>=0) say(m.x,m.floor,'♥','#ff7ab0',1.4); } }
  else if(a==='train'&&m){ err=trainMon(m); if(!err) toast(`${m.name} berlatih keras.`); }
  else if(a==='fuse'&&m){ UI.fuseA=UI.fuseA===m.id?null:m.id; UI.fuseB=null; }
  else if(a==='fuseNo'){ UI.fuseB=null; }
  else if(a==='tabGudang'){ openPanel('gudang'); return; }
  else if(a==='tabMon'){ openPanel('monster'); return; }
  else if(a==='eqCancel'){ UI.eqSlot=null; }
  else if(a==='skipLearn'&&m){ skipLearn(m); }
  else if(a==='buyItem'){ const r=buyItem(); if(typeof r==='string') err=r; else toast(`Dapat ${r.n} (${RARITY[r.r]})!`); }
  else if(a==='fuseGo'&&m){ const b=G.mons.find(x=>x.id===UI.fuseB); if(b){ err=fuseMons(m,b); if(!err){ toast('Fusi berhasil!'); UI.fuseB=null; UI.fuseA=null; } } }
  else if(a==='release'&&m) UI.confirmRel=m.id;
  else if(a==='releaseNo') UI.confirmRel=null;
  else if(a==='releaseGo'&&m){ if(m.secret) clearSecret(m); G.mons=G.mons.filter(x=>x!==m); UI.confirmRel=null; toast(`${m.name} kembali ke alam liar.`); openPanel('monster'); return; }
  else if(a==='unsecret'&&m){ clearSecret(m); toast(`${m.name} keluar dari ruang rahasia.`); }
  else if(a==='trapUp'){ err=upgradeTrap(UI.sel.f,UI.sel.i); }
  else if(a==='sell'){ removeFix(UI.sel.f,UI.sel.i); closePanel(); toast('Dibongkar.'); return; }
  else if(a==='move'){ const s=UI.sel; closePanel(); UI.placing={move:{f:s.f,i:s.i},t:'_'}; $('placebar').hidden=false; $('placeTxt').textContent='Ketuk petak kosong tujuan.'; return; }
  else if(a==='save'){ toast(saveGame()?'Tersimpan.':'Tidak bisa menyimpan di perangkat ini.'); }
  else if(a==='newgame') UI.confirmNew=true;
  else if(a==='newgameNo') UI.confirmNew=false;
  else if(a==='newgameGo'){ UI.confirmNew=false; EFX.length=0; TIMERS.length=0; newGame(); saveGame(); closePanel(); $('ticker').innerHTML=''; scrollToFloor(0); toast('Kastil baru berdiri.'); return; }
  if(err) toast(err);
  renderPanel();
}

    if(hit.k==='slot'){ if(G.fix[hit.f][hit.i]){ toast('Petak itu sudah terisi.'); return; } if(UI.placing.move){ const mv=UI.placing.move; const err=moveFix(mv.f,mv.i,hit.f,hit.i); if(err) toast(err); else toast('Dipindahkan.'); stopPlacing(); return; } const err=orderPlace(hit.f,hit.i,UI.placing); if(err) toast(err); else toast('Mira berangkat memasang!'); }
    return; }
  if(hit.k==='m'){ UI.monId=hit.id; UI.fuseA=null; UI.eqSlot=null; UI.sel={k:'m',id:hit.id}; openPanel('mon'); return; }
  if(hit.k==='a'){ UI.advId=hit.id; openPanel('adv'); return; }
  if(hit.k==='l'){ openPanel('raja'); return; }
  if(hit.k==='slot'){ if(G.fix[hit.f][hit.i]){ UI.sel={k:'fix',f:hit.f,i:hit.i}; openPanel('fix'); } else { UI.target={f:hit.f,i:hit.i}; openPanel('bangun'); } }
}
function startPlacing(fx){
  if(UI.target){ const t=UI.target; UI.target=null; const err=orderPlace(t.f,t.i,fx); if(err) toast(err); else toast('Mira berangkat memasang!'); closePanel(); return; }
  UI.placing=fx; closePanel(); $('placebar').hidden=false; $('placeTxt').textContent=`Ketuk petak kosong untuk ${fx.t==='chest'?'Peti '+fx.r:FIX[fx.t].n} (${fmt(fixCost(fx))} emas). Bisa beberapa kali.`;
}
function stopPlacing(){ UI.placing=null; $('placebar').hidden=true; }
/* ---------- pengikat event ---------- */
function bindUI(){
  $('sheetX').onclick=closePanel;
  $('placeCancel').onclick=stopPlacing;
  $('mira').onclick=nextTip;
  $('bTop').onclick=()=>{ RC.follow=false; $('bFollow').setAttribute('aria-pressed','false'); scrollToFloor(topF()); };
  $('bBot').onclick=()=>{ RC.follow=false; $('bFollow').setAttribute('aria-pressed','false'); scrollToFloor(0); };
  $('bFollow').onclick=()=>{ RC.follow=!RC.follow; $('bFollow').setAttribute('aria-pressed',String(RC.follow)); };
  for(const b of document.querySelectorAll('#spd button')) b.onclick=()=>{ UI.speed=+b.dataset.s; for(const o of document.querySelectorAll('#spd button')) o.setAttribute('aria-pressed',String(o===b)); };
  for(const b of document.querySelectorAll('#nav button')) b.onclick=()=>{ if(UI.panel===b.dataset.p){ closePanel(); return; } UI.target=null; openPanel(b.dataset.p); };
  const B=$('sheetB');
  B.addEventListener('click',e=>{
    const t=e.target.closest('[data-act],[data-buy],[data-mon],[data-g],[data-fb],[data-guard],[data-unguard],[data-adv],[data-eqs],[data-uneq],[data-eqi],[data-forge],[data-sell],[data-forget]'); if(!t) return;
    if(t.dataset.act) return act(t.dataset.act,t);
    if(t.dataset.buy) return startPlacing(JSON.parse(t.dataset.buy));
    if(t.dataset.mon){ UI.monId=+t.dataset.mon; UI.fuseA=null; UI.sel={k:'m',id:UI.monId}; openPanel('mon'); const m=G.mons.find(x=>x.id===UI.monId); if(m&&m.floor>=0){ RC.follow=false; $('bFollow').setAttribute('aria-pressed','false'); scrollToFloor(m.floor); } return; }
    if(t.dataset.g){ const n=t.dataset.g.startsWith('10')?10:1; const r=gacha(n,t.dataset.g.endsWith('g')?'gold':'jiwa'); if(r.err) toast(r.err); else { UI.gres=r.out.map(m=>m.id); const best=Math.max(...r.out.map(m=>SPECIES[m.sp].rar)); if(best>=3) miraTip(`Kyaa~ ${RARITY[best]} pertama kita! Yang Mulia beruntung sekali!`,'rar'+best); } renderPanel(); return; }
    if(t.dataset.fb){ UI.fuseB=+t.dataset.fb; renderPanel(); return; }
    if(t.dataset.guard){ const {f,i}=UI.sel; const m=G.mons.find(x=>x.id===+t.dataset.guard); if(m){ const err=addSecret(f,i,m); toast(err||`${m.name} masuk ke ruang rahasia.`); renderPanel(); } return; }
    if(t.dataset.unguard){ const m=G.mons.find(x=>x.id===+t.dataset.unguard); if(m){ clearSecret(m); m.px=SLOT_X(ri(1,8)); toast(`${m.name} keluar dari ruang rahasia.`); renderPanel(); } return; }
    if(t.dataset.adv){ UI.advId=+t.dataset.adv; openPanel('adv'); return; }
    const mm=UI.monId&&G.mons.find(x=>x.id===UI.monId);
    if(t.dataset.forget&&mm){ const err=forgetAbil(mm,t.dataset.forget); toast(err||`${mm.name} melupakan ${ABIL[t.dataset.forget].n}.`); renderPanel(); return; }
    if(t.dataset.eqs){ UI.eqSlot=UI.eqSlot===t.dataset.eqs?null:t.dataset.eqs; renderPanel(); return; }
    if(t.dataset.uneq&&mm){ unequip(mm,t.dataset.uneq); renderPanel(); return; }
    if(t.dataset.eqi&&mm){ const it=G.inv.find(x=>x.id===+t.dataset.eqi); const err=equipItem(mm,it); toast(err||`${mm.name} memakai ${it.n}.`); UI.eqSlot=null; renderPanel(); return; }
    if(t.dataset.forge){ const it=G.inv.find(x=>x.id===+t.dataset.forge); const err=it&&forgeItem(it); toast(err||`${it.n} kini +${it.lv}!`); renderPanel(); return; }
    if(t.dataset.sell){ const it=G.inv.find(x=>x.id===+t.dataset.sell); if(it){ sellItem(it); toast(`Terjual ${itemValue(it)} emas.`); } renderPanel(); return; }
  });
  B.addEventListener('change',e=>{
    const m=UI.monId&&G.mons.find(x=>x.id===UI.monId);
    if(e.target.id==='autoChest') G.settings.autoChest=e.target.checked;
    if(!m) return;
    if(e.target.id==='mFloor'){ const f=+e.target.value; if(f>=0&&floorCount(f)>=FLOOR_CAP&&m.floor!==f){ toast('Lantai itu penuh.'); renderPanel(); return; } if(m.secret) clearSecret(m); m.floor=f; m.px=SLOT_X(ri(1,8)); m.x=m.px; if(f>=0){ RC.follow=false; $('bFollow').setAttribute('aria-pressed','false'); scrollToFloor(f); } toast(f<0?`${m.name} istirahat di cadangan.`:`${m.name} pindah ke lantai ${f+1}.`); renderPanel(); }
    if(e.target.id==='mStrat'){ m.strat=e.target.value; m.revealed=0; m.hidden=false; toast(`Strategi ${m.name}: ${STRAT[m.strat]}.`); }
    if(e.target.id==='mFlee'){ m.flee=e.target.checked; }
  });
  // ikon navigasi
  const ic={bangun:null,monster:null,panggil:g=>{ g.strokeStyle='#c78aff'; g.lineWidth=2; g.beginPath(); g.arc(16,20,10,0,6.3); g.stroke(); g.fillStyle='#ffd36a'; g.fillRect(15,9,3,3); g.fillRect(6,22,3,3); g.fillRect(24,22,3,3); },
    petualang:g=>g.drawImage(sprite({race:'manusia',stage:'dewasa',job:'ksatria',sex:'m',skin:'#f1c9a5',hair:'#6a4a2a',eye:'#2a1e2a',cloth:'#5b7aa8',cloth2:'#3f4a6a',outfit:'tunik',style:'short'},'side',0),0,0),raja:g=>g.drawImage(sprite({race:'iblis',stage:'dewasa',job:'rajaIblis',sex:'m',skin:RACE.iblis.skin[0],hair:RACE.iblis.hair[0],eye:'#ff3040',cloth:'#2a1a2a',cloth2:'#5a1a2a',outfit:'mantel',style:'long'},'side',0),0,0)};
  ic.monster=null;
  for(const cv of document.querySelectorAll('canvas[data-ic]')){ const k=cv.dataset.ic; if(k==='monster') iconSpr(cv,monSpr('slime',0)); else if(k==='bangun') iconFix(cv,{t:'chest',r:'A'}); else if(k==='petualang'||k==='raja'){ const c=document.createElement('canvas'); c.width=32; c.height=36; ic[k](c.getContext('2d')); iconSpr(cv,c); } else paintIcon(cv,ic[k]); }
  iconSpr($('miraCv'),assistSpr(0));
}
function updateHUD(){
  $('rMana').textContent=fmt(G.mana); $('rGold').textContent=fmt(G.gold); $('rJiwa').textContent=fmt(G.jiwa); $('rPop').textContent=fmt(G.pop);
  $('day').textContent=`Hari ${G.day} · ${G.floors} lantai`;
}
/* ---------- kamera ikut ---------- */
function followCam(dt){
  if(!RC.follow) return;
  let f=null; for(const a of G.advs) if(f==null||a.floor>f) f=a.floor;
  if(f==null) f=G.assist.q.length?G.assist.f:0;
  const vh=(RC.h-(RC.padB||0))/RC.s; const goal=clamp(floorTop(f)+FH/2-vh*.45,Math.min(0,worldH()-vh),Math.max(0,worldH()-vh));
  RC.camY+=(goal-RC.camY)*Math.min(1,dt*2.5);
}
/* ---------- loop ---------- */
let lastT=0, acc=0, saveAcc=0, hudAcc=0;
function frame(ts){
  const real=Math.min(.25,(ts-(lastT||ts))/1000); lastT=ts;
  acc+=real*UI.speed; let n=0; while(acc>=DT&&n<40){ step(); acc-=DT; n++; } if(n>=40) acc=0;
  { const sh=$('sheet'); RC.padB=sh.hidden?0:sh.offsetHeight*(RC.cv.width/RC.cv.getBoundingClientRect().width); }
  followCam(real); render();
  hudAcc+=real; if(hudAcc>.25){ hudAcc=0; updateHUD(); }
  if(UI.panel&&['mon','petualang','raja','adv','fix'].includes(UI.panel)&&performance.now()-UI.lastRefresh>1000&&!(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName))) renderPanel();
  saveAcc+=real; if(saveAcc>15){ saveAcc=0; saveGame(); }
  requestAnimationFrame(frame);
}
function boot(data){
  if(data&&data.G){ G=data.G; } else if(!loadGame()) newGame();
  initCanvas($('cv')); bindUI(); updateHUD(); miraTip('Selamat datang, Yang Mulia! Ketuk petak kosong untuk memasang jebakan atau peti. Ketuk saya kapan saja untuk laporan kastil.','welcome');
  scrollToFloor(0);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveGame(); });
  window.claude?.hot?.snapshot?.(()=>({G}));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
