<title>Takhta Jurang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Signika:wght@400;500;600&display=swap">
<style>
/* Layout: satu layar ala Kairosoft. Irisan kastil memenuhi panggung, sumber daya di atas, navigasi di bawah, panel naik dari bawah. Tampilan malam ungu-bara, satu tema. */
:root{
  --night:#0d0a14; --stone:#171220; --stone2:#211a2c; --stone3:#2c2339; --line:#3b2e4a;
  --bone:#efe6d8; --mute:#a596b4; --ember:#ff8a3a; --mana:#b98aff; --gold:#ffd36a; --soul:#7fd8ff;
  --blood:#e0506a; --heal:#8fe89a; --pink:#ff9ad0;
  --r-n:#b9b4a4; --r-r:#7fd8ff; --r-sr:#c78aff; --r-ssr:#ffd36a; --r-ur:#ff7a5a;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Signika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:560px;margin:0 auto;background:var(--stone)}
header{display:flex;flex-direction:column;gap:5px;padding-block:7px 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--stone2);border-bottom:2px solid var(--line)}
.row1{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
.day{font-family:var(--display);font-size:13px;color:var(--mute)}
.spd{margin-left:auto;display:flex;gap:3px}
.spd button{background:var(--stone);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-family:var(--display);font-size:13px;color:var(--mute);min-width:32px}
.spd button[aria-pressed="true"]{color:var(--night);background:var(--gold);border-color:var(--gold)}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.chip{display:flex;align-items:center;gap:5px;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:2px 6px;min-width:0}
.chip i{width:9px;height:9px;flex:0 0 auto;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.chip b{font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{font-size:10.5px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.chip .lbl{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.stage{position:relative;min-height:0;overflow:hidden;background:#0b0812;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ticker{position:absolute;left:8px;right:8px;top:6px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.ticker div{background:rgba(13,10,20,.82);border-left:3px solid var(--mute);border-radius:4px;padding:3px 7px;font-size:12.5px;line-height:1.25;animation:tin .25s ease-out}
.ticker .kill{border-color:var(--blood)} .ticker .lord{border-color:var(--gold);color:var(--gold)} .ticker .evo{border-color:var(--mana)} .ticker .warn{border-color:var(--ember)} .ticker .adv{border-color:var(--soul)}
@keyframes tin{from{opacity:0;transform:translateY(-4px)}}
.side{position:absolute;right:8px;bottom:62px;display:flex;flex-direction:column;gap:5px}
.side button{width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:rgba(23,18,32,.92);font-family:var(--display);font-size:12px;color:var(--bone)}
.side button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mira{position:absolute;left:8px;right:52px;bottom:8px;display:flex;align-items:flex-end;gap:6px;pointer-events:none}.mira canvas{pointer-events:auto;cursor:pointer}.mira p{opacity:.93}
.mira canvas{position:static;width:40px;height:45px;flex:0 0 auto;image-rendering:pixelated;background:var(--stone2);border:1px solid var(--line);border-radius:7px}
.mira p{margin:0;background:rgba(33,26,44,.95);border:1px solid #6a3a5a;border-radius:9px 9px 9px 2px;padding:5px 9px;font-size:12.5px;line-height:1.3;color:#ffe0f0}
.mira p b{color:var(--pink)}
.placebar{position:absolute;left:8px;right:8px;top:6px;display:flex;align-items:center;gap:8px;background:#3a1a34;border:1px solid var(--pink);border-radius:8px;padding:6px 10px;font-size:13.5px}
.placebar button{margin-left:auto;background:transparent;border:1px solid var(--pink);border-radius:6px;color:var(--pink);padding:2px 10px}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--stone2);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{background:transparent;border:0;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:12px}
nav button canvas{width:22px;height:22px;image-rendering:pixelated}
nav button[aria-pressed="true"]{color:var(--gold);background:var(--stone3)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;display:flex;flex-direction:column;background:var(--stone2);border-top:2px solid var(--gold);border-radius:12px 12px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);z-index:5}
.sheet-h{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:17px;color:var(--gold);letter-spacing:.03em}
.sheet-h .x{margin-left:auto;background:var(--stone);border:1px solid var(--line);border-radius:6px;width:32px;height:28px}
.sheet-b{overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.sec h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.card{background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;gap:7px;align-items:center;text-align:left;min-width:0}
button.card:hover{border-color:#5a4a6a}
.card .ic{width:34px;height:38px;flex:0 0 auto;image-rendering:pixelated}
.card .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.card .t b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t span{font-size:11.5px;color:var(--mute);line-height:1.25}
.cost{font-family:var(--display);font-size:12.5px;color:var(--gold)} .cost.m{color:var(--mana)} .cost.j{color:var(--soul)}
.btn{background:var(--stone3);border:1px solid #4a3a5a;border-radius:7px;padding:6px 11px;font-size:13.5px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600}
.btn.warn{border-color:var(--blood);color:#ff9aa8}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--stone);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.rar{font-family:var(--display);font-weight:700;font-size:12px;padding:0 5px;border-radius:4px;color:var(--night)}
.abl{display:flex;flex-direction:column;gap:5px}
.abl div{background:var(--stone);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px}
.mods{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.mod{font-size:11px;padding:1px 6px;border-radius:4px;background:#2a3a2a;color:#a8f0a0}.mod.off{opacity:.4;text-decoration:line-through}.rune{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid;background:rgba(0,0,0,.25)}.rune.empty{border-style:dashed;border-color:var(--line);color:var(--mute)}.dur{display:block;height:3px;background:rgba(0,0,0,.4);border-radius:2px;margin-top:5px;overflow:hidden}.dur i{display:block;height:100%}
.abl b{font-weight:600} .abl em{font-style:normal;font-size:10.5px;padding:0 5px;border-radius:3px;margin-left:5px;background:var(--stone3);color:var(--mute)}
.mhead{display:flex;gap:10px;align-items:center}
.mhead canvas{width:68px;height:76px;image-rendering:pixelated;background:var(--stone);border:1px solid var(--line);border-radius:9px;flex:0 0 auto}
.mhead .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.mhead .nm b{font-family:var(--display);font-size:19px;font-weight:600}
.name-edit{display:flex;gap:5px} .name-edit input{flex:1;min-width:0;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
select{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.log li{border-left:3px solid var(--line);padding:2px 7px;line-height:1.3}
.log .kill{border-color:var(--blood)} .log .lord{border-color:var(--gold)} .log .evo{border-color:var(--mana)} .log .warn{border-color:var(--ember)} .log .adv{border-color:var(--soul)}
.note{font-size:12.5px;color:var(--mute);margin:0}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--stone3);border:1px solid var(--gold);border-radius:8px;padding:6px 12px;font-size:13.5px;z-index:9;max-width:90%;text-align:center}
.party{background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:4px}
.party b{font-weight:600} .party .mem{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute)}
.gres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.gres div{background:var(--stone);border:1px solid var(--line);border-radius:7px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;text-align:center;line-height:1.15}
.gres canvas{width:34px;height:38px;image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){ .ticker div{animation:none} }
</style>
<div class="app" id="app">
  <header>
    <div class="row1"><span class="brand">Takhta Jurang</span><span class="day" id="day">Hari 1</span>
      <div class="spd" id="spd"><button data-s="0" aria-label="Jeda">II</button><button data-s="1" aria-pressed="true">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div></div>
    <div class="res">
      <div class="chip"><i style="background:var(--mana)"></i><span class="lbl"><small>Mana</small><b id="rMana">0</b></span></div>
      <div class="chip"><i style="background:var(--gold)"></i><span class="lbl"><small>Emas</small><b id="rGold">0</b></span></div>
      <div class="chip"><i style="background:var(--soul)"></i><span class="lbl"><small>Jiwa</small><b id="rJiwa">0</b></span></div>
      <div class="chip"><i style="background:var(--ember)"></i><span class="lbl"><small>Populer</small><b id="rPop">0</b></span></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ticker" id="ticker"></div>
    <div class="placebar" id="placebar" hidden><span id="placeTxt">Ketuk petak kosong</span><button id="placeCancel">Batal</button></div>
    <div class="side"><button id="bTop" aria-label="Ke singgasana">▲</button><button id="bFollow" aria-pressed="true" aria-label="Ikuti petualang">IKUT</button><button id="bBot" aria-label="Ke pintu masuk">▼</button></div>
    <div class="mira" id="mira"><canvas id="miraCv" width="32" height="36"></canvas><p id="miraTxt"></p></div>
    <div class="sheet" id="sheet" hidden><div class="sheet-h"><h2 id="sheetT"></h2><button class="x" id="sheetX" aria-label="Tutup">✕</button></div><div class="sheet-b" id="sheetB"></div></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <nav id="nav">
    <button data-p="bangun"><canvas width="32" height="36" data-ic="bangun"></canvas>Bangun</button>
    <button data-p="monster"><canvas width="32" height="36" data-ic="monster"></canvas>Monster</button>
    <button data-p="panggil"><canvas width="32" height="36" data-ic="panggil"></canvas>Panggil</button>
    <button data-p="petualang"><canvas width="32" height="36" data-ic="petualang"></canvas>Petualang</button>
    <button data-p="raja"><canvas width="32" height="36" data-ic="raja"></canvas>Raja</button>
  </nav>
</div>
